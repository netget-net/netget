# Prebuilt-binary release sets (GitHub Releases / npm @smotana/netget).
# Trim policy: a feature stays in a target's set iff it compiles for that target in CI
# AND adds no runtime dynamic-link dependency users may lack.
# Excluded everywhere: stun/turn (ancient nix 0.8 dep), smb-client (libsmbclient),
# embedded-llm (LLM backend, not a protocol; heavy llama.cpp build).
# Excluded on Linux: bluetooth-ble* (libdbus), nfc* (libpcsclite), datalink/arp/isis (libpcap).
# icmp is included here (not libpcap-gated: it only pulls in pnet's packet parsing +
# socket2 raw sockets). It builds on Linux/macOS because pnet_datalink's Linux (AF_PACKET)
# and macOS (BPF) backends are plain libc syscalls with no external link dependency. It is
