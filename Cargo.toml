[package]
# crates.io's `netget` and `netget-cli` are unrelated projects, so the package is netget-tool.
# The library stays `netget` ([lib] below) and the installed command stays `netget`
# (src/bin/netget.rs).
name = "netget-tool"
version = "0.3.5"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Network protocol stubbing toolkit: ~280 protocol servers and clients whose responses come from an LLM, a script, a static rule or a person."
repository = "https://github.com/netget-net/netget"
homepage = "https://netget.net"
readme = "README.md"
keywords = ["network", "protocol", "llm", "mock", "server"]
categories = ["network-programming", "command-line-utilities", "development-tools::testing"]
# What crates.io receives: the sources, the build inputs and the license. Tests, fuzz targets,
# the site, docs and the in-tree AGENTS.md/CLAUDE.md notes stay in the repository (the upload
# limit is 10 MB compressed).
include = [
    "/src/**/*.rs",
    "/src/**/*.json",
    "/prompts/**",
    "/proto/**",
    "/build.rs",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "netget"

[workspace]
members = ["crates/*"]
# `fuzz/` is a cargo-fuzz package and its own workspace root. It needs a nightly
# toolchain and links libFuzzer's sanitizer runtime, so it must stay invisible to
# `cargo build`/`cargo test`/`cargo check` here. It already excludes itself via its
# own `[workspace]` table; this makes that intentional rather than incidental.
exclude = ["fuzz", "vendor"]
resolver = "2"

[features]
# Protocols are not features. Every protocol compiles on every platform it supports (the
# browser build and Windows each skip the ones they cannot build; see AGENTS.md). Features
# select what needs a system library, and optional capabilities.
default = [
    "libpcap", "bluetooth", "pcsc", "libusb", "libsmbclient",
    "mcp-stdio", "mcp-http", "embedded-llm", "sqlite",
]

# System libraries. Each is Unix-only and gates the protocols that link it; without it those
# protocols are simply absent from the build.
libpcap = ["dep:pcap"]  # arp, datalink, isis, lldp, cdp, stp, eapol
bluetooth = ["dep:btleplug", "dep:ble-peripheral-rust", "dep:bluer"]  # bluetooth-ble* (CoreBluetooth on macOS; BlueZ over D-Bus on Linux)
pcsc = ["dep:pcsc"]  # NFC client (PC/SC; pcsclite on Linux)
libusb = ["dep:usbip", "dep:serde_cbor", "dep:memmap2"]  # usb-* virtual devices over USB/IP
libsmbclient = ["dep:pavao"]  # SMB client

# Optional capabilities.
# The rmcp `client` feature is enabled so the in-process MCP smoke tests can drive the server.
mcp-stdio = ["dep:rmcp", "dep:schemars", "rmcp/client"]  # MCP STDIO server mode for Claude Desktop/Code integration
mcp-http = ["dep:rmcp", "dep:schemars", "rmcp/client", "rmcp/transport-streamable-http-server"]  # MCP HTTP/SSE server mode for remote/web MCP clients
embedded-llm = ["dep:llama-cpp-2", "dep:hf-hub"]  # Embedded LLM inference via llama.cpp (needs cmake and a C++ compiler)
sqlite = ["dep:rusqlite"]  # SQLite databases the model can create at runtime
gpu = ["dep:gfxinfo"]  # GPU stats in the dashboard (not on macOS, see AGENTS.md)
vendored-openssl = ["dep:openssl-sys"]  # Static OpenSSL for release builds (OPC UA crypto)
terminal-snapshot = []  # Terminal snapshot testing (PTY-based TUI tests)

[dependencies]

# Async runtime
tokio-util = { version = "0.7", features = ["codec", "compat"] }
tokio-stream = "0.1"

# Low-level system bindings
libc = "0.2"

# OpenSSL (for transitive dependencies like git2, ssh2, native-tls)
# Vendored = compile from source, needed for Android/cross-compilation
openssl-sys = { version = "0.9", optional = true, features = ["vendored"] }

# Terminal UI - crossterm (rolling terminal) + ratatui (full-screen dashboard).
# ratatui is pinned to 0.29: 0.30 moves to crossterm 0.29 and we pin crossterm 0.28.
futures = "0.3"
textwrap = "0.16"

# HTTP client for Ollama
des = { version = "0.8" }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "http2"] }

# Ollama Rust client

# HTTP server
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
http = "1.3"  # Needed for h2 Request/Response types

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"  # YAML serialization for OpenAPI specs
toml = "0.8"  # TOML serialization for config files

# MCP STDIO server (Model Context Protocol)
rmcp = { version = "1.2", optional = true, features = ["server", "transport-io"] }
schemars = { version = "1.0", optional = true }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Byte manipulation
bytes = "1.8"
hex = "0.4"
base64 = "0.22"
serde_urlencoded = "0.7"  # query strings and form bodies on the browser HTTP transport (src/client/http_fetch)

# Socket options (SO_REUSEADDR)

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Syntax highlighting for script code

# Utilities
chrono = { version = "0.4", features = ["serde", "wasmbind"] }  # wasmbind: js Date on wasm32, inert elsewhere
time = { version = "0.3", features = ["macros", "formatting"] }  # Time handling for rcgen certificates
url = "2.5"  # URL parsing for web approval prompts
regex = "1.11"
urlencoding = { version = "2.1" }
html2text = "0.12"
once_cell = "1.20"
rand = "0.8"  # Random number generation for crypto
handlebars = "5.1"
walkdir = "2.4"
include_dir = "0.7"  # Embed template directory in binary
sysinfo = "0.32"  # System monitoring (CPU, memory, processes)
gfxinfo = { version = "0.1", optional = true, default-features = false, features = ["gpu_info"] }  # Cross-platform GPU monitoring (NVIDIA, AMD, Intel)

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Home directory
dirs = "5.0"




# TLS support for DoT and DoH
# default-features off: the default `aws_lc_rs` provider is a C library that does not build for
# wasm32, and the binary installs the `ring` provider explicitly anyway (src/bin/netget.rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = { version = "2.0" }
webpki-roots = { version = "0.26" }  # Root certificates for TLS verification

# HTTP/2 support for DoH
h2 = { version = "0.4" }

# DHCP server
dhcproto = { version = "0.12" }

# SNMP agent
rasn-snmp = { version = "0.18" }
rasn-smi = { version = "0.18" }
rasn = { version = "0.18" }

# Syslog server
syslog_loose = { version = "0.22" }

async-trait = "0.1"


# Telnet server
nectar = { version = "0.4" }







rcgen = { version = "0.14", features = ["x509-parser"] }  # For certificate generation

# WebDAV server








# rasn is already included via snmp feature, but we explicitly depend on it for LDAP too




# OpenID Connect client
openidconnect = { version = "3.5" }


netgauze-bgp-pkt = { version = "0.7", features = ["serde", "codec"] }

# Bitcoin P2P protocol (blockchain P2P network)
bitcoin = { version = "0.32" }



# OpenVPN VPN server (full implementation with TLS control channel)
# rustls, tokio-rustls, sha2, hmac, hkdf, rand already declared above

uuid = { version = "1.11", features = ["v4"] }



# XML-RPC server and client (XML parsing for RPC protocol)
quick-xml = { version = "0.37", features = ["serialize"] }

# SAML client (compression for HTTP-Redirect binding)
flate2 = { version = "1.0", features = ["zlib-rs"] }



sha2 = { version = "0.10" }  # SHA-256 for ntor handshake
md-5 = { version = "0.10" }  # MD5 for the RADIUS authenticators (RFC 2865 §3, §5.2) - already in the tree transitively
aes = { version = "0.8" }  # AES for relay cell encryption
hmac = { version = "0.12" }  # HMAC for ntor authentication
# x25519-dalek already used by wireguard feature, don't redeclare
# tokio-rustls already available, don't redeclare
# rcgen already used by proxy feature, don't redeclare

# Display module (for VNC and other protocols requiring image generation)
tiny-skia = "0.11"  # 2D graphics rendering
cosmic-text = "0.12"  # Text rendering with font support
image = "0.25"  # Image buffer manipulation
sys-locale = "0.3"  # System locale detection for text rendering


# OpenAPI 3.1 server (runtime request validation and route matching)
openapi-rs = { package = "netget-openapi-rs", version = "0.1.0" }
matchit = { version = "0.8" }  # High-performance path router for OpenAPI

# Kafka broker (wire protocol parsing and serialization)
kafka-protocol = { package = "netget-kafka-protocol", version = "0.14.1" }  # Code-generated Kafka protocol support


# BitTorrent protocols (bencode encoding/decoding)
serde_bencode = { version = "0.2" }  # Bencode serialization for BitTorrent protocols


# OAuth2 client
oauth2 = { version = "4.4" }

# SNMP client
snmp = { version = "0.2" }
# MongoDB server and client
bson = { version = "3.0", features = ["serde", "serde_with-3", "serde_json-1"] }  # BSON encoding/decoding for MongoDB
# RSS feed generation and parsing
rss = { version = "2.0" }




# USB Smart Card dependencies
# sha2 already defined above for wireguard/tor

# Embedded LLM inference (llama.cpp bindings)
llama-cpp-2 = { version = ">=0.1.127, <0.1.158", optional = true }  # Rust bindings to llama.cpp for local GGUF model inference. 0.1.127 is the first that builds on aarch64 Linux (c_char is u8 there); 0.1.158 moved tokenisation onto LlamaVocab
hf-hub = { version = "0.3", optional = true, features = ["tokio"] }  # Hugging Face Hub API for model downloading

# SQLite database support (in-memory or file-based)
rusqlite = { version = "0.37", optional = true, features = ["bundled", "limits", "hooks"] }  # SQLite library with bundled SQLite (matches tor-dirmgr dependency)
sha1 = { version = "0.10" }

# Linux-only dependencies
#
# BlueZ over D-Bus, for BLE advertising payloads (bluetooth-ble-beacon). This is the same crate
# ble-peripheral-rust already uses for its Linux backend, so no second D-Bus stack is added; it
# is declared directly because ble-peripheral-rust exposes no way to set ManufacturerData or
# ServiceData, which is the entire content of a beacon. Optional and target-gated: enabling the
# feature on macOS/Windows is a no-op and the protocol refuses to start there.
# ---------------------------------------------------------------------------------------------
# Native only. Each of these needs an operating system: a tty (crossterm, termbg), sockets
# (tokio's net/process/signal features, socket2, ollama-rs through them) or a C library
# (syntect's onig). The wasm32 table below supplies the same names for the browser build.
# ---------------------------------------------------------------------------------------------
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.41", features = ["full"] }
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
tui-textarea = "0.7"
termbg = "0.5"  # Terminal background detection for adaptive theming
ollama-rs = { version = "0.3.3", features = ["stream"] }
socket2 = { version = "0.5", features = ["all"] }  # Socket options (SO_REUSEADDR)
fs2 = "0.4"  # Cross-process lock for non-destructive legacy settings migration
syntect = "5.3"
encoding_rs = "0.8"  # AFP long names and volume names are MacRoman
unicode-normalization = "0.1"  # AFP 3 sends UTF-8 names decomposed (NFD)

# ---------------------------------------------------------------------------------------------
# wasm32-unknown-unknown: the browser demo (crates/netget-web). `tokio` and `crossterm` are
# shim crates - see crates/netget-tokio-wasm and crates/netget-crossterm-wasm - bound to those
# names in src/lib.rs so the protocol servers and the dashboard compile without a `#[cfg]` at
# each use. The rest are per-crate switches their upstream needs on this target.
# ---------------------------------------------------------------------------------------------

# Protocols the browser build cannot compile (real sockets, processes, C libraries).
opcua = { package = "netget-async-opcua", version = "=0.19.0", features = ["server", "client"] }
apollo-compiler = { version = "1.33.0" } # graphql: parse, validate, introspect, execute
tiger = { version = "0.2" }
bzip2 = { version = "0.5", features = ["static"] }
# DNS server (Hickory DNS, formerly Trust-DNS)
hickory-server = { version = "0.24", features = ["dns-over-https-rustls", "dns-over-rustls"] }
hickory-proto = { version = "0.24", features = ["dns-over-https-rustls", "dns-over-rustls", "dnssec-ring"] }
# SSH server
russh = { version = "0.45" }
russh-keys = { version = "0.45" }
russh-sftp = { version = "2.1" }
# SMTP server
rust-smtp-server = { version = "0.1" }
# mDNS/DNS-SD service discovery
mdns-sd = { version = "0.15" }
# MySQL server
opensrv-mysql = { version = "0.7" }
# IPP (Internet Printing Protocol)
ipp = { version = "5.3" }
# PostgreSQL server
pgwire = { version = "0.35" }
# Redis server (RESP protocol)
redis-protocol = { version = "6.0" }
# Cassandra/CQL server
cassandra-protocol = { version = "3.3" }
# WebRTC client (peer-to-peer data channels, no media)
webrtc = { version = "0.11" }
# WebRTC Signaling Server (WebSocket-based SDP relay)
tokio-tungstenite = { version = "0.21" }
srt-tokio = { version = "0.4.4" }  # SRT (Secure Reliable Transport): pure-Rust ARQ, TSBPD and AES
# LDAP server (ASN.1 BER encoding for LDAP protocol)
ldap3_proto = { version = "0.3" }
# IMAP server (IMAP protocol parsing)
imap-codec = { version = "2.0.0-alpha.6" }
# MQTT broker (IoT messaging)
rumqttd = { version = "0.20" }
# SOCKS5 client (proxy protocol client)
tokio-socks = { version = "0.5" }
# BGP server (Border Gateway Protocol)
zenoh = { version = "=1.10.1", default-features = false, features = ["transport_tcp", "unstable"] }  # Zenoh runtime for the zenoh feature; TCP only
# Nostr relay: BIP-340 Schnorr verification and signing. The same 0.29 that `bitcoin` links,
# so the tree carries one secp256k1, not two curve libraries.
secp256k1 = { version = "0.29", features = ["recovery"] }
# Stratum V2: the Noise transport's AEAD (ChaCha20-Poly1305, IETF); its chacha20 and poly1305
# are the versions already in the tree.
chacha20poly1305 = { version = "0.10" }
# devp2p: keccak-256 (block hashes, RLPx secrets and MACs) and Snappy (message compression
# after Hello v5). Both are the versions already in the tree through other crates.
sha3 = { version = "0.10" }
snap = { version = "1.1" }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }  # For WireGuard key generation
# NGAP: SUCI concealment Profile B (TS 33.501 Annex C.3.4.2), ECDH on secp256r1. The 0.13 line is
# already in the tree through other crates; only its `ecdh` feature is new.
p256 = { version = "0.13", features = ["ecdh"] }
# MCP (Model Context Protocol) server
axum = { version = "0.7" }
tower-http = { version = "0.5", features = ["fs", "trace"] }
# gRPC server with dynamic schema support
tonic = { package = "netget-tonic", version = "0.12.3", features = ["gzip", "tls-webpki-roots"] }
prost = { version = "0.13" }
prost-reflect = { version = "0.14" }
prost-types = { version = "0.13" }
tonic-web = { package = "netget-tonic-web", version = "=0.12.3" }
tonic-reflection = { package = "netget-tonic-reflection", version = "0.12.3" }
tower = { version = "0.5" }
tempfile = { version = "3.13" }
etcd-client = { package = "netget-etcd-client", version = "0.15.1" }
# ZooKeeper client
zookeeper-async = { version = "5.0" }
xmlrpc = { version = "0.15" }  # XML-RPC client library
lz4_flex = { version = "0.11" }  # ClickHouse native compressed frames (pure Rust)
naive-cityhash = { version = "0.2" }  # CityHash128 v1.0.2, the ClickHouse frame checksum (pure Rust)
# OTLP/HTTP receiver: the OpenTelemetry project's generated protobuf message types, without
# tonic's transport or the serde layer (JSON is walked as serde_json::Value instead).
# 0.29 because its tonic is 0.12, the same tonic grpc/etcd/tonic-reflection/etcd-client use;
# 0.30 pulls tonic 0.13 and 0.31 tonic 0.14 + prost 0.14. Move them together.
opentelemetry-proto = { package = "netget-opentelemetry-proto", version = "0.29.0", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs", "gen-tonic"] }
ed25519-dalek = { version = "2.1" }  # Ed25519 signatures for relay identity
rsa = { version = "0.9", features = ["sha2"] }  # ActivityPub: HTTP signatures (rsa-sha256)
num-bigint = { version = "0.4" }  # NVMe/TCP DH-HMAC-CHAP: the RFC 7919 ffdhe group exponentiations
md4 = { version = "0.10" }  # MD4: rsync protocol 29 file and block checksums, and its daemon auth response
ctr = { version = "0.9" }  # CTR mode for AES
hkdf = { version = "0.12" }  # HKDF for key derivation in ntor
font8x8 = { version = "0.3" }  # Guacamole: the model's text, rendered to PNG
# HTTP/3 protocol (HTTP over QUIC - UDP-based, encrypted, multiplexed - RFC 9114)
quinn = { version = "0.11" }  # Async QUIC implementation for HTTP/3
h3 = { version = "0.0.8" }  # HTTP/3 implementation
h3-quinn = { package = "netget-h3-quinn", version = "0.0.10" }  # QUIC adapter for HTTP/3
wtransport = { package = "netget-wtransport", version = "=0.7.2", default-features = false, features = ["ring", "quinn", "self-signed"] }  # WebTransport, NetGet fork (github.com/netget-net/wtransport)
wtransport-proto = { package = "netget-wtransport-proto", version = "=0.7.2", features = ["async"] }
# AWS SDK for SQS and DynamoDB clients
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-sqs = { version = "1.86" }
aws-sdk-dynamodb = { version = "1.52" }
aws-smithy-types = { version = "1.3" }
# OpenAI API client
async-openai = { version = "0.26" }
# DNS client (includes TLS for DoT/DoH)
hickory-client = { version = "0.24", features = ["dns-over-rustls", "dns-over-https-rustls"] }
# NTP client
rsntp = { version = "4.0" }
# SSH client
ssh2 = { version = "0.9" }
# IRC client
irc = { version = "1.1" }
# SMTP client
lettre = { version = "0.11" }
# MySQL client
mysql_async = { version = "0.34" }
# MSSQL (SQL Server) client
tiberius = { version = "0.12" }
# PostgreSQL client
tokio-postgres = { version = "0.7" }
mongodb = { version = "3.3" }  # Official MongoDB async driver
# redis-rs: used only by tests, as an independent client of NetGet's Redis server (src/ frames
# RESP itself). An optional dev-dependency is not possible, so it rides on the `redis` feature;
# `cluster-async` is its cluster client, which tests/server/redis/cluster_test.rs drives.
redis = { version = "0.27", features = ["tokio-comp", "cluster-async"] }
# CouchDB client
couch_rs = { version = "0.10" }
form_urlencoded = { version = "1.2" }
# WebDAV client
reqwest_dav = { version = "0.2" }
# Cassandra client
scylla = { version = "1.3" }
# LDAP client
ldap3 = { version = "0.11" }
# IMAP client
async-imap = { version = "0.11" }
async-native-tls = { version = "0.5" }
# S3 client
rust-s3 = { version = "0.37" }
aws-sdk-s3 = { version = "1.90" }
aws-credential-types = { version = "1.2" }
picky-krb = { version = "0.12" }  # Kerberos ASN.1 types and RFC 3962 crypto
picky-asn1 = { version = "0.10" }
picky-asn1-der = { version = "0.5" }
# Git client
git2 = { version = "0.19" }
# MQTT client
rumqttc = { version = "0.24" }
# AMQP client
lapin = { version = "4.0.0-rc.1" }
# The Kafka client needs no dependency of its own: it uses `kafka-protocol` in the client
# direction (request encoders, response decoders) through the re-export the Kafka broker
# already provides. rdkafka/librdkafka was removed - it aborted in malloc, and the optional
# `rdkafka` feature it left behind gated the client out of every `--features kafka` build.
# Kubernetes client with v1.30 API support (latest in k8s-openapi 0.24)
kube = { version = "0.99", features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.24", features = ["v1_30"] }
# NDEF (NFC Data Exchange Format) message parsing and generation
# USB client
nusb = { version = "0.1" }
# USB FIDO2 dependencies
ring = { version = "0.17", features = ["std"] }  # ECDSA P-256 cryptography for FIDO2
# iSCSI header and data digests (CRC32C, RFC 7143 §13.1) - already in the tree transitively
crc32c = { version = "0.6" }
# HDFS DataTransferProtocol chunk checksums of type CRC32 (CRC32C is the crate above) - already
# in the tree transitively
crc32fast = { version = "1.5" }
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Cargo forbids one dependency name resolving to different packages per target, so these keep
# their own names here and `src/lib.rs` binds them as `tokio` and `crossterm` for the whole
# crate with `extern crate netget_tokio_wasm as tokio;` (only on this target).
netget-tokio-wasm = { path = "crates/netget-tokio-wasm", version = "0.1.0" }
netget-crossterm-wasm = { path = "crates/netget-crossterm-wasm", version = "0.1.0" }
ratatui = { version = "0.29", default-features = false }
tui-textarea = { version = "0.7", default-features = false, features = ["ratatui", "no-backend"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }  # onig needs a C compiler
web-time = "1"  # std::time::Instant panics on this target; see src/utils/clock.rs
getrandom = { version = "0.2", features = ["js"] }  # rand, rcgen
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }  # rustls/rcgen
rustls-pki-types = { version = "1", features = ["web"] }  # UnixTime::now on wasm
uuid = { version = "1.11", features = ["js"] }  # v4 needs a randomness source

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", optional = true, features = ["bluetoothd"] }
# SocketCAN is an AF_CAN socket family that exists only in the Linux kernel. Target-gated for the
# same reason as bluer above: the `can` feature compiles everywhere, and the protocol returns a
# clear Err naming the platform rather than being hidden, on every other OS.
socketcan = { version = "3.5" }
# FUSE: the kernel's /dev/fuse, mounted through the setuid fusermount3 helper. Without the
# `libfuse` feature fuser links no C library on Linux (its build script selects the pure-Rust
# mount); on macOS its build script needs macFUSE, which is why this table is Linux-only.
fuser = { version = "0.18", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# FUSE on macOS through FUSE-T, which is found and started at runtime, never linked: NetGet
# launches FUSE-T's go-nfsv4 server itself and gives fuser the FUSE requests it relays.
# `macos-no-mount` keeps fuser's build script from requiring macFUSE through pkg-config. Not
# `macfuse-4-compat`: FUSE-T's libfuse2 profile sends the 8-byte rename_in, without macFUSE 4's
# flags (measured: with them, fuser read the first eight bytes of the old name as flags).
fuser = { version = "0.18", default-features = false, features = ["macos-no-mount"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dev-dependencies]
# These fixture dependencies expose Unix-only process/terminal APIs.
pty-process = "0.5"
nix = { version = "0.29", features = ["signal", "process", "term", "ioctl"] }

[target.'cfg(unix)'.dependencies]

# Protocols that build only on Unix (raw sockets, pty, Unix pipes, platform crates).
# ARP (Address Resolution Protocol) packet handling
pnet = { version = "0.35" }
# SSH Agent protocol (key management server and client)
ssh-agent-lib = { version = "0.5" }
# HTTP Proxy (MITM)
http-mitm-proxy = { version = "0.16" }
tokio-native-tls = { version = "0.3" }
native-tls = { version = "0.2" }
# NFS server
nfsserve = { version = "0.10" }
# STUN server (Session Traversal Utilities for NAT)
webrtc-stun = { version = "0.1" }
stunclient = { version = "0.4" }  # STUN client for discovering external IP/port
# TURN server (Traversal Using Relays around NAT)
webrtc-turn = { version = "0.1" }
# XMPP/Jabber client (instant messaging)
tokio-xmpp = { version = "5.0" }
xmpp-parsers = { version = "0.22" }
# Named by tokio-xmpp's `ServerConnector::connect` signature (`sasl::common::ChannelBinding`),
# which tokio-xmpp does not re-export; the version tokio-xmpp 5.0 itself locks.
sasl = { version = "0.5.2" }
# WireGuard VPN server (full implementation with LLM control)
defguard_wireguard_rs = { version = "0.7", features = ["serde"] }
# Tor directory mirror (Tor protocol parsing and generation)
tor-netdoc = { version = "0.36" }  # Tor network document parsing (consensus, descriptors)
tor-cert = { version = "0.36" }  # Tor certificate handling
# Tor relay (OR protocol cell handling and cryptography)
tor-cell = { version = "0.36" }  # Tor cell encoding/decoding (RELAY, CREATE, etc.)
# NFS client
nfs3_client = { version = "0.7", features = ["tokio"] }
# Tor client with experimental-api for directory access
arti-client = { version = "0.36", features = ["experimental-api"] }
ironrdp-connector = { version = "0.10" }
ironrdp-session = { version = "0.11" }
ironrdp-tokio = { version = "0.10" }
ironrdp-tls = { version = "0.2", features = ["rustls-ring"] }
ironrdp-input = { version = "0.7" }
ironrdp-pdu = { version = "0.9" }
ironrdp-graphics = { version = "0.9" }
tor-rtcompat = { version = "0.36" }
tor-dirmgr = { version = "0.36" }  # Tor directory manager types
tor-netdir = { version = "0.36" }  # Tor network directory queries
# NFS types for NFSv3 protocol
nfs3_types = { version = "0.4" }
tun = { version = "0.8.14" }

# System libraries, each behind the feature of the same purpose (see [features]).
# Packet capture (libpcap) - optional: only linked by features that sniff L2
# (datalink/arp/isis). Kept out of portable release binaries to avoid a
# libpcap runtime dependency.
pcap = { version = "2.2", optional = true }
# SMB client (native libsmbclient wrapper; the server uses its own codec)
pavao = { version = "0.2", optional = true }
# Bluetooth Low Energy (BLE) client - cross-platform (Windows, macOS, Linux)
btleplug = { version = "0.11", optional = true }
# Bluetooth Low Energy (BLE) server/peripheral - cross-platform (Windows, macOS, Linux)
ble-peripheral-rust = { version = "0.2", optional = true }
# NFC (Near Field Communication) via PC/SC - cross-platform smart card API (Windows/macOS native, Linux pcscd)
pcsc = { version = "2.9", optional = true }
# USB/IP protocol for virtual USB device creation
usbip = { version = "0.9", optional = true }
# Memory-mapped file I/O for USB MSC disk images
memmap2 = { version = "0.9", optional = true }
serde_cbor = { version = "0.11", optional = true }  # CBOR encoding for CTAP2

[dev-dependencies]
# For async tests
tokio-test = "0.4"
# For e2e test setup/teardown
ctor = "0.2"
# For creating temporary mock config files
tempfile = "3.13"

# Terminal snapshot parsing
vt100 = "0.15"

# E2E test dependencies (only used when protocol features are enabled via test files' cfg gates)
# Axum for creating test HTTP servers in proxy e2e tests
axum = "0.7"
# Axum server with TLS support for HTTPS test servers
axum-server = { version = "0.6", features = ["tls-rustls"] }
# gRPC client dependencies for e2e integration tests
prost = "0.13"
prost-reflect = "0.14"
prost-types = "0.13"
# HTTP/3 (QUIC) client for e2e integration tests
quinn = "0.11"
# Modbus client for the modbus server e2e tests. Deliberately a *different* implementation
# from src/server/modbus/codec.rs, which is hand-rolled: decoding our frames with someone
# else's codec is what makes the test evidence rather than a tautology.
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp"] }
# CoAP codec + client for the coap server e2e tests, for the same reason: coap-lite is an
# independent RFC 7252 implementation, and the coap crate is a full client on top of it.
coap-lite = "0.13"
coap = "0.27"
# BitTorrent client for e2e integration tests
# Using cratetorrent library for programmatic testing, also supports transmission-cli/aria2
sha1 = "0.10"  # For info_hash calculation
# Independent feed parser for the rss server e2e test, for the same reason as tokio-modbus and
# coap-lite above. `src/server/rss` builds its XML with the `rss` crate's ChannelBuilder, so
# parsing the result back with the `rss` crate would only prove that one crate round-trips
# through itself. feed-rs is a separate implementation with its own model, so it is the thing
# that makes the test evidence.
feed-rs = "2"
# XML parser for the webdav server's second-client test, which drives `curl -X PROPFIND` and
# has to read the DAV:multistatus body back as a tree. Substring-matching a tag name would pass
# against a body that is not well-formed XML at all, which is precisely the failure an
# under-escaped `displayname` or an under-encoded `href` produces. Unconditional and in
# dev-dependencies deliberately: quick-xml's entry in [dependencies] is optional and turned on
# only by `saml`/`xmlrpc`, so a test gated on `webdav` alone could not see it, and a test that
# cannot compile under its own feature is a test that never runs.
quick-xml = "0.37"
async-nats = "0.50.0"
async-stomp = "0.6.3"
# Property-based round-trip tests for the hand-written codecs (tests/codec_property_test.rs).
# `std` only: no forking, no persistence file, so a failing case is reported by the test
# binary rather than written into the source tree.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
# An independent EtherCAT MainDevice that drives the EtherCAT slave (tests/server/ethercat):
# its frames reach the slave over EtherCAT-in-UDP through a test bridge on every platform, and
# over its own raw socket on a veth in the pair job. NetGet's own master is hand-written and
# does not use it, so it is evidence for the slave and never a peer for the master.
ethercrab = { version = "0.7", default-features = false, features = ["std"] }

[build-dependencies]
# Protocol buffers for the etcd and gNMI servers. protoc comes from protoc-bin-vendored unless
# PROTOC names one, so building NetGet needs no protobuf compiler installed.
prost-build = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3"

[profile.release]
# Keep prebuilt binaries small: symbols stripped, thin LTO.
strip = "symbols"
lto = "thin"
# Arithmetic overflow must panic where it SHIPS, not only where it is tested.
#
# Cargo's default is the exact opposite: `overflow-checks` is on in dev/test and off in release.
# STOMP's `content-length: 18446744073709551615` is the worked example - it panicked in every
# test build and wrapped silently in the shipped one, so the place it was found was the place
# it was harmless. A wrapped length is a wrong answer given confidently; a panic is a logged
# task death (`src/panic_log.rs`), which is strictly better for a server whose inputs are
# hostile by design.
overflow-checks = true

# RSA key generation, optimised even in debug and test builds. ActivityPub makes a 2048-bit key
# every time it starts, and unoptimised big-integer arithmetic took 1.4 s for it on an idle
# M-series Mac and past 15 s under load, which `protocol_startup_smoke_test` reports as a hang.
# Only these two crates are affected; NetGet's own code keeps its debug settings.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

# NVMe/TCP DH-HMAC-CHAP: an ffdhe8192 exponentiation, unoptimised, takes seconds, and the
# Linux host gives the whole exchange a timeout of its own.
[profile.dev.package.num-bigint]
opt-level = 3

# The browser bundle (crates/netget-web, ./web/build.sh): size over speed. With 68 protocols
# compiled in, the .wasm is what the visitor downloads, and it is not CPU-bound.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

# hyper, patched for the browser build: vendor/hyper is the exact crates.io source of the
# version Cargo.lock pins, changed only in src/common/date.rs under
# cfg(all(target_arch = "wasm32", target_os = "unknown")) so that the HTTP date cache reads
# JavaScript's clock instead of `SystemTime::now()`, which panics there and took down the
# page on the first request to every hyper server. Native builds compile the upstream code
# unchanged. vendor/hyper/README.md has the diff and how to re-apply it on a hyper upgrade;
# tests/vendored_hyper_patch_test.rs fails when Cargo.lock and the vendored copy disagree.
[patch.crates-io]
# hyper 1.7.0 reads std's clock, which panics on wasm32-unknown-unknown; this copy reads
# JavaScript's Date.now() there and is otherwise upstream (vendor/hyper/README.md). Only the
# browser build is affected, so the published crate uses upstream hyper. NetGet's security
# patches to other crates live in published forks (github.com/netget-net), not here.
hyper = { path = "vendor/hyper" }
