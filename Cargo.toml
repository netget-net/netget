tcp = []
socket_file = []  # Unix domain socket server & client for IPC (Unix/Linux/macOS only, gated with #[cfg(unix)]), no extra deps
named_pipe = []  # POSIX named pipe (mkfifo FIFO) server, impersonates an OS-level IPC endpoint (Unix only, #[cfg(unix)]), no extra deps
pty = []  # Pseudo-terminal (openpty) server, LLM role-plays a program on a terminal (Unix only, #[cfg(unix)]); libc only, no extra deps
stdio = []  # NetGet as a stdin/stdout/stderr pipe filter, LLM drives the streams (Unix only, #[cfg(unix)]); refuses under TUI/--mcp; no extra deps
http = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:rcgen", "urlencoding"]
http2 = ["dep:h2", "dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:rcgen"]
pypi = ["http", "urlencoding"]  # PyPI (Python Package Index) uses HTTP and URL encoding for search (PEP 503 Simple Repository API)
maven = []  # Maven repository server (HTTP-based artifact distribution)
udp = []
datalink = ["dep:pcap"]  # DataLink sniffs L2 frames via libpcap
arp = ["pnet", "dep:pcap"]  # ARP (Address Resolution Protocol) uses pnet for packet handling + libpcap for capture
icmp = ["pnet", "socket2/all"]  # ICMP (Internet Control Message Protocol) uses pnet for packet handling + raw sockets (requires socket2 'all' feature for Type::RAW)
ndp = ["pnet", "socket2/all"]  # IPv6 Neighbor Discovery (ICMPv6) - raw socket via pnet + socket2
dhcpv6 = ["dhcproto"]  # DHCPv6 (RFC 8415) server on UDP 547 - reuses dhcproto
tuntap = ["dep:tun"]  # TUN/TAP interface endpoint - every routed IP packet becomes an event
rawip = ["socket2/all"]  # Generic raw IP protocol-N listener (GRE 47, ESP 50, ...) - raw socket via socket2; the codec is hand-written
gtp = []  # GTP-C / GTP-U mobile core (UDP 2123/2152) server and client (SGSN/SGW/MME side) - hand-rolled, no extra deps
m3ua = []  # M3UA/SIGTRAN - SCTP where available, refuses elsewhere; no extra deps
can = ["dep:socketcan"]  # CAN bus via SocketCAN - Linux only, target-gated like bluetooth-ble-beacon
lldp = ["pnet", "dep:pcap"]  # LLDP link-layer discovery - raw Ethernet via pnet, capture via libpcap
cdp = ["pnet", "dep:pcap"]  # Cisco Discovery Protocol - raw Ethernet SNAP via pnet, capture via libpcap
stp = ["dep:pcap"]  # STP/RSTP bridge protocol data units - raw 802.3 LLC via libpcap (codec is hand-written; pnet is not used)
vrrp = ["socket2/all", "dep:sha1"]  # VRRP v2/v3 and CARP - IP protocol 112 raw socket; sha1 for CARP's HMAC-SHA1 auth field
hsrp = []  # HSRP v1/v2 gateway redundancy over UDP 1985 - no extra deps
eapol = ["pnet", "dep:pcap", "dep:md-5"]  # EAPOL / 802.1X authenticator - libpcap capture; md-5 for the RFC 1994 MD5-Challenge digest
wol = []  # Wake-on-LAN magic packet listener (UDP 9) - no extra deps
