name: Release

# Tag push (v*) builds all targets, creates the GitHub Release, and publishes
# the npm packages. workflow_dispatch runs the build matrix only (validation).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protocol-validation:
    name: Peer and news release gate
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/protocol-pairs.yml
    with:
      suite: p2p-news
    permissions:
      contents: read

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: '2'
    strategy:
      fail-fast: false
      matrix:
        # Every protocol a target can build is compiled in; `features` adds the capabilities
        # and the system-library protocols. macOS ships libpcap, PC/SC and CoreBluetooth. The
        # glibc Linux binaries link libpcap, libdbus-1 and libpcsclite (installed below, and
        # needed at run time — docs/guides/INSTALL.md lists the packages). The musl and
        # Windows binaries need no system library: those protocols are absent there.
        # `libusb` and `libsmbclient` are in no release binary. Keep this in step with the
        # table in docs/guides/INSTALL.md and with the Dockerfile.
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            features: mcp-stdio,mcp-http,sqlite,vendored-openssl,libpcap,bluetooth,pcsc
            key: darwin-arm64
            ext: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-14 # cross-compiled from Apple Silicon; Intel runners are scarce
            features: mcp-stdio,mcp-http,sqlite,vendored-openssl,libpcap,bluetooth,pcsc
            key: darwin-x64
            ext: tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            features: mcp-stdio,mcp-http,sqlite,vendored-openssl,libpcap,bluetooth,pcsc
            system_libs: true
            key: linux-x64
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm # native arm64 runner, so the arm64 -dev packages are native too
            features: mcp-stdio,mcp-http,sqlite,vendored-openssl,libpcap,bluetooth,pcsc
            system_libs: true
            key: linux-arm64
            ext: tar.gz
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            features: mcp-stdio,mcp-http,sqlite,vendored-openssl
            key: linux-x64-musl
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            features: mcp-stdio,mcp-http,sqlite,vendored-openssl
            key: win32-x64
            ext: zip
    steps:
      - uses: actions/checkout@v4

      # The monolithic crate needs the same memory headroom as the heavy CI jobs.
      # Without swap Linux runners can shut down during release code generation.
      - name: Make room for release compilation
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/netget-swap
          sudo chmod 600 /mnt/netget-swap
          sudo mkswap /mnt/netget-swap
          sudo swapon /mnt/netget-swap
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          free -h
          df -h / /mnt

      - name: Assert tag matches Cargo.toml version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Headers and link libraries for the `libpcap`, `bluetooth` (BlueZ over D-Bus) and `pcsc`
      # features. Both glibc targets build on a native runner, so no cross packages are needed.
      - name: Install system libraries (libpcap, D-Bus, PC/SC)
        if: matrix.system_libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev libdbus-1-dev libpcsclite-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Select native Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { throw "Strawberry Perl is missing: $perl" }
          & $perl -MLocale::Maketext::Simple -MIPC::Cmd -e 'print "OpenSSL Perl modules available\n"'
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL Perl modules are missing" }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        env:
          LZMA_API_STATIC: "1" # Bundle XZ instead of linking the runner's Homebrew installation.
        shell: bash
        run: |
          cargo build --release --locked \
            --no-default-features --features ${{ matrix.features }} \
            --target ${{ matrix.target }}

      - name: Verify macOS runtime libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          report="$RUNNER_TEMP/netget-runtime-libraries.txt"
          otool -L "target/${{ matrix.target }}/release/netget" > "$report"
          cat "$report"
          while IFS= read -r library; do
            case "$library" in
              /System/Library/*|/usr/lib/*) ;;
              *) echo "Unexpected non-system runtime library: $library" >&2; exit 1 ;;
            esac
          done < <(awk 'NR > 1 { print $1 }' "$report")

      # The glibc binaries may need exactly the libraries docs/guides/INSTALL.md tells users to
      # install: glibc, zlib, and the three system libraries. Each of those three must be
      # present (so the features really are compiled in), and anything else is a new runtime
      # dependency nobody has documented.
      - name: Verify Linux runtime libraries
        if: matrix.system_libs
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/netget"
          needed=$(readelf -d "$bin" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | sort)
          echo "$needed"
          for lib in libpcap.so.0.8 libdbus-1.so.3 libpcsclite.so.1; do
            grep -qx "$lib" <<< "$needed" || { echo "$lib is not linked: the feature that needs it did not build" >&2; exit 1; }
          done
          while IFS= read -r lib; do
            case "$lib" in
              ld-linux-x86-64.so.2|ld-linux-aarch64.so.1|libc.so.6|libm.so.6|libgcc_s.so.1|libpthread.so.0|libdl.so.2|librt.so.1|libz.so.1) ;;
              libpcap.so.0.8|libdbus-1.so.3|libpcsclite.so.1) ;;
              *) echo "Unexpected runtime library: $lib (document it in docs/guides/INSTALL.md and allow it here)" >&2; exit 1 ;;
            esac
          done <<< "$needed"

      - name: Package
        shell: bash
        run: |
          bin=netget
          [ "${{ matrix.key }}" = "win32-x64" ] && bin=netget.exe
          archive="netget-${{ matrix.target }}.${{ matrix.ext }}"
          mkdir -p out
          # Archive the bare binary at the archive root (cd in, like tar -C),
          # so both the npm platform packages and the launcher's extraction
          # find netget[.exe] without a nested path.
          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd "target/${{ matrix.target }}/release" && 7z a "$GITHUB_WORKSPACE/out/$archive" "$bin")
          else
            tar czf "out/$archive" -C "target/${{ matrix.target }}/release" "$bin"
          fi
          cd out
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: netget-${{ matrix.key }}
          path: out/*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [build, protocol-validation]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify archives and build checksum manifest
        run: |
          cd artifacts
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done
          cat ./*.sha256 | LC_ALL=C sort -k2 > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --notes "$(cat .github/release-notes-platforms.md)" \
            --generate-notes \
            artifacts/*

  npm-publish:
    name: Publish npm packages
    needs: github-release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify downloaded archives
        run: |
          cd artifacts
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done
      - name: Extract binaries
        run: |
          mkdir -p binaries
          for key in darwin-arm64 darwin-x64 linux-x64 linux-arm64 linux-x64-musl win32-x64; do
            mkdir -p "binaries/$key"
            case "$key" in
              darwin-arm64)   triple=aarch64-apple-darwin ;;
              darwin-x64)     triple=x86_64-apple-darwin ;;
              linux-x64)      triple=x86_64-unknown-linux-gnu ;;
              linux-arm64)    triple=aarch64-unknown-linux-gnu ;;
              linux-x64-musl) triple=x86_64-unknown-linux-musl ;;
              win32-x64)      triple=x86_64-pc-windows-msvc ;;
            esac
            if [ "$key" = "win32-x64" ]; then
              unzip -o "artifacts/netget-$triple.zip" -d "binaries/$key"
            else
              tar xzf "artifacts/netget-$triple.tar.gz" -C "binaries/$key"
            fi
          done
      - name: Generate packages
        run: node scripts/npm/prepare-packages.mjs "${GITHUB_REF_NAME#v}" --binaries binaries
      - name: Publish (platform packages first, main last)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in dist/npm/netget-*; do
            (cd "$dir" && npm publish --provenance --access public)
          done
          (cd dist/npm/netget && npm publish --provenance --access public)
