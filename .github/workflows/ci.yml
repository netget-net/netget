name: CI

# PR gate + push-to-master build. Mirrors release.yml's toolchain/caching
# conventions but never builds --all-features (too slow/heavy for a gate,
# and pulls in system libs CI runners lack - see CLAUDE.md). Uses a
# representative protocol subset instead.
on:
  pull_request:
  push:
    branches: [master]
  # A manual dispatch runs everything below; pushes and pull requests skip the jobs gated
  # on `github.event_name == 'workflow_dispatch'` (single-feature, smb-evidence, clippy-wide
  # and registry-audit), which are too slow to run on every change at this protocol count.
  # Dispatch against a branch to get them before merging something that touches a protocol.
  workflow_dispatch:

# The event name is part of the group on purpose. Without it a dispatched run and a
# push-to-master run share `ci-CI-refs/heads/master`, and `cancel-in-progress` makes each
# kill the other, so a push would abort a dispatched run partway through and report
# nothing. That mattered most when a dispatch was the only way to check 109 of the
# features; it still keeps a deliberate manual run from being cancelled by unrelated
# traffic on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Protocols are not Cargo features: every protocol compiles in every build. CI_FEATURES is
  # the capability features the blocking jobs build with - no system library (libpcap, dbus,
  # libusb, pcsclite, libsmbclient) and no embedded llama.cpp, so the runner installs nothing
  # to compile. The system-library protocols are built by registry-audit, which installs them.
  CI_FEATURES: mcp-stdio,mcp-http,sqlite
  # CI_FEATURES plus terminal-snapshot, used for the blocking clippy run only.
  # terminal-snapshot gates tests/terminal_snapshot/, which is where the
  # clippy::zombie_processes violation lived that leaked a live `netget` process on
  # every run. Without the feature that whole file is invisible to the gate.
  LINT_FEATURES: mcp-stdio,mcp-http,sqlite,terminal-snapshot
  # The protocol suites the blocking `test` job runs out of tests/server and tests/client.
  # Every protocol's suite compiles there; only these run, because the others drive
  # third-party binaries this job does not install (registry-audit does).
  #
  # `finger` is here for one reason and it is not coverage of Finger: it is the only
  # **Experimental** protocol in this set. `min_stability_test`'s refusal half asks the
  # registry for an Experimental protocol and fails when none is compiled - that half now
  # always has one, but finger's suite still keeps an Experimental protocol under test here.
  CI_PROTOCOL_TESTS: >-
    server::tcp:: server::http:: server::dns:: server::udp:: server::redis:: server::finger::
    client::tcp:: client::http:: client::dns:: client::udp:: client::redis:: client::finger::

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    # Every protocol compiles now, so a cold cache is a full build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint

      # Every protocol is in the one library crate. Checking it peaks at ~12 GB of memory (a
      # runner has 16), and every test binary that links it is ~870 MB, so the runner's ~14 GB
      # of free disk runs out partway through linking. A starved runner does not fail, it
      # "loses communication with the server". Swap on /mnt, the runner's second disk, and the
      # preinstalled SDKs nothing here uses (~30 GB) are the room.
      - name: make room (swap and disk)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/netget-swap
          sudo chmod 600 /mnt/netget-swap
          sudo mkswap /mnt/netget-swap
          sudo swapon /mnt/netget-swap
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          free -h
          df -h / /mnt

      # BLOCKING. This was advisory while the repo carried ~2,700 pre-existing
      # fmt diffs; the repo-wide pass landed in f17b7938, so the tree is clean
      # and the gate now holds it there. If this fails, run `cargo fmt`.
      - name: cargo fmt --check
        run: cargo fmt --check

      # BLOCKING, but narrowly scoped: a full default `cargo clippy` on
      # CI_FEATURES currently emits ~50 warnings (redundant_closure,
      # too_many_arguments, needless_return, new_without_default, etc.) -
      # all style/complexity lints, verified 2026-08-04 against a clean
      # checkout of master. None are clippy::correctness or
      # clippy::suspicious lints, so denying just those two groups is
      # green today and still catches real bugs (the kind of thing that
      # would otherwise ship silently) rather than nothing at all.
      #
      # --all-targets is NOT decoration. Without it clippy lints the lib only, and
      # every one of ~200 test files is exempt from the gate. Two clippy::suspicious
      # violations were living there unseen, both invisible to this job for that
      # reason plus a missing feature:
      #   * tests/terminal_snapshot/mod.rs - clippy::zombie_processes. Seventeen tests
      #     spawned the netget binary into a PTY, bound it to `let _child` and returned.
      #     Child::drop neither kills nor waits, so every run leaked a live netget
      #     process, and this project's rules say netget processes are never killed -
      #     so nothing reaped them afterwards either.
      #   * tests/helpers/event_trigger.rs - clippy::empty_line_after_doc_comments.
      # Both are fixed; keeping --all-targets (and LINT_FEATURES) is what stops them
      # coming back.
      - name: "cargo clippy (blocking: correctness + suspicious, lib + all test targets)"
        run: |
          cargo clippy --locked --no-default-features --features "$LINT_FEATURES" --all-targets \
            -- -D clippy::correctness -D clippy::suspicious

      # ADVISORY: full default lint set (style/complexity/perf included),
      # across lib + tests. Not blocking today because of the ~50 (lib) +
      # more (tests) existing warnings noted above; kept here so warning
      # counts are visible in CI and don't silently grow unnoticed while
      # this gate is tightened over time.
      - name: "cargo clippy (advisory: full default lints, incl. tests)"
        continue-on-error: true
        run: |
          echo "::notice::Full clippy (default lints, --all-targets) is advisory-only today; only correctness/suspicious are enforced above."
          cargo clippy --locked --no-default-features --features "$LINT_FEATURES" --all-targets

  # ADVISORY, deliberately. The blocking `lint` job already sees every protocol except the
  # ones behind a system-library feature (libpcap, bluetooth, pcsc, libusb, libsmbclient);
  # this run adds those, with their libraries installed. It is advisory because it is the
  # only place the ~50 style warnings on those protocols are counted, and a gate whose first
  # act is to redden master on pre-existing style warnings teaches people to ignore it.
  clippy-wide:
    name: Clippy (default features, advisory)
    # Only on a manual run of this workflow. Its warnings are style rather than defects and it
    # cannot fail the build. It is the one clippy run over the system-library protocols.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-wide

      - name: Install the system libraries the default features link
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev libdbus-1-dev libusb-1.0-0-dev libpcsclite-dev libsmbclient-dev libltdl-dev cmake

      - name: "cargo clippy (advisory: default features)"
        continue-on-error: true
        run: |
          cargo clippy --locked --all-targets -- -D clippy::correctness -D clippy::suspicious

  # ADVISORY, deliberately. These test binaries walk the protocol REGISTRIES rather
  # than any one protocol, so what they actually cover is decided entirely by which
  # features are compiled in - and every other job here compiles 6 of 116. That blind
  # spot is not hypothetical: `usb-fido2` shipped advertising three events to the model
  # with no actions attached, and `cargo test --features usb-fido2,tcp` reported
  # "3 passed" because the audit early-returned on a protocol with no sync actions at
  # all. The rule was tightened and, re-run at --all-features, flagged exactly that one
  # protocol and produced no false positives across the other 115.
  #
  # This is the only job that installs the system libraries --all-features needs, and it
  # builds the whole tree to do it (~10 min cold). Kept advisory until it has been green
  # for a while: a wide build that has never run in CI should not be the thing that
  # blocks an unrelated PR on day one. Promote it to blocking once it has proven stable.
  # Every ratchet in this job reads the SOURCE TREE rather than walking a registry, so each
  # one covers all ~137 server and ~98 client protocols at *any* feature set. That is what
  # makes them blocking: `registry-audit` below has to compile `--all-features` and install
  # five system libraries to see the whole tree, so it is advisory and, being
  # continue-on-error, reports green regardless of outcome. These need one protocol feature
  # and nothing else, and they fail the build.
  #
  # The distinction matters because the six-protocol `test` job covers 6 of 116 — a green PR
  # says nothing about the other 110 — and every defect class these encode was found in
  # several unrelated protocols at once.
  ratchets:
    name: Whole-tree ratchets
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ratchets

      # Every protocol is in the one library crate. Checking it peaks at ~12 GB of memory (a
      # runner has 16), and every test binary that links it is ~870 MB, so the runner's ~14 GB
      # of free disk runs out partway through linking. A starved runner does not fail, it
      # "loses communication with the server". Swap on /mnt, the runner's second disk, and the
      # preinstalled SDKs nothing here uses (~30 GB) are the room.
      - name: make room (swap and disk)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/netget-swap
          sudo chmod 600 /mnt/netget-swap
          sudo mkswap /mnt/netget-swap
          sudo swapon /mnt/netget-swap
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          free -h
          df -h / /mnt

      # Ten at a time with each batch's executables deleted after it: all of them at once
      # filled the runner's disk.
      - name: cargo test (source-reading ratchets)
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          TEST_THREADS: '50'
          TARGETS: >-
            affirmative_default_drift_test
            audit_ci_coverage_test
            client_event_wiring_test
            decision_tag_ratchet_test
            doc_paths_exist_test
            doc_test_counts_test
            event_emit_sites_test
            example_hex_drift_test
            executable_examples_test
            failure_mode_declaration_test
            handler_result_decides_the_bound_test
            narrowing_cast_drift_test
            no_protocol_is_hidden_from_the_model_test
            recursive_decoder_depth_test
            request_only_declaration_test
            startup_param_drift_test
            tcp_server_bounds_ratchet_test
            max_inbound_bytes_declaration_test
            peer_handle_coverage_ratchet_test
            real_client_evidence_is_run_test
            test_suite_hygiene_test
            vendored_hyper_patch_test
            vendored_tonic_patch_test
        run: scripts/test_batches.sh --locked --no-default-features

      - name: Build wrapper and credential configuration regressions
        run: python3 tests/build_scripts_test.py -v

      # BLOCKING, and it belongs here rather than in `registry-audit`: the script reads
      # source only, so it needs no build, no features and no binaries — and
      # `registry-audit` is `continue-on-error`, where a green result proves nothing.
      #
      # `--check` fails only on what a static read can be *sure* of: a Beta whose peer is
      # only a circular crate, only a generic HTTP library, or absent entirely; a
      # skip-and-pass gate; every test `#[ignore]`d. The cases that need judgement — a peer
      # shared with the server, which is legitimate for quic and webrtc — are reported and
      # do not fail.
      #
      # It went green on both sides for the first time on 16 September 2026, after its
      # loudest warning turned out to fire on a condition nothing in the tree has. Making
      # it blocking is what stops it drifting back: the alternative is an advisory job
      # nobody reads, which is how the hand-maintained list in CLAUDE.md was wrong three
      # times.
      - name: Beta evidence check (server and client)
        run: |
          python3 scripts/beta_evidence_table.py --check
          python3 scripts/beta_evidence_table.py --side client --check

      # BLOCKING. Nothing else in CI touches `fuzz/`, which is how a fuzz target rots in
      # silence: `fuzz/fuzz_targets/coap_message.rs` stopped compiling hours after it was
      # written, when `CoapMessage::encode` became fallible, and nobody noticed for weeks —
      # while the Stable bar's "a fuzz target exists and has run clean" was being satisfied by
      # a target that could not build.
      #
      # `cargo check` rather than `cargo fuzz build`: the fuzz crate's own header says it needs
      # nightly and libFuzzer's sanitizer runtime, and both of those are about *linking*.
      # Checking compiles the targets against the current library API, which is the drift that
      # actually happens, and it runs on stable in about two minutes.
      #
      # `--manifest-path` is required: the crate is deliberately its own workspace and is named
      # under the root `[workspace] exclude`, so no root-level cargo command reaches it.
      #
      # **No `--locked` here, and that is not an oversight.** `fuzz/.gitignore` deliberately
      # ignores `fuzz/Cargo.lock` — that crate exists to be rebuilt against whatever the main
      # crate resolves, so a pinned lockfile there only ever goes stale. `--locked` then fails
      # before compiling anything, with "cannot create the lock file … because --locked was
      # passed", which is a workflow contradiction rather than a finding about the targets.
      # This step's job is to catch a target that stopped compiling against the current
      # library API; resolution drift is the root workspace's problem and is `--locked` there.
      # The fuzz crate turns on `lldp`/`cdp` (libpcap) and `nfc`/`nfc-client` (pcsclite), so
      # checking it needs those headers even though nothing here links libFuzzer.
      # `.github/workflows/fuzz.yml` installs the same two and its comment says to keep this
      # list in sync — it was not, because until now no job on this side built `fuzz/` at all.
      - name: install the fuzz crate's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev libpcsclite-dev

      - name: Check interrupted evidence reporting
        run: python3 .github/scripts/test_summarize_evidence.py

      - name: cargo check (fuzz targets still compile)
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets

  registry-audit:
    name: Registry-wide audits (--all-features, advisory)
    # Manual runs only (Actions → Run workflow): too heavy for every push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    # The previous 45-minute budget expired during SMB after 45 passing groups.
    # Leave room for cold compilation, every evidence group, and artifact upload.
    timeout-minutes: 120
    continue-on-error: true
    # At 273 protocol features the --all-features test build was killed mid-compile
    # (SIGTERM from the runner's memory-pressure killer). Debug info is most of what
    # rustc and the linker hold for it, and these audits never read a backtrace's line
    # numbers; fewer parallel jobs bound the peak.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4

      - name: Set evidence output directory outside the checkout
        # build.rs watches package files by default. Status updates inside the checkout
        # would invalidate the precompiled binaries before every evidence group.
        run: printf 'EVIDENCE_DIR=%s/netget-real-client-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      # Carbon 1.1.10 uses APIs removed in Python 3.12. Pin the interpreter used
      # by every Python peer so Graphite shares the same runtime as its pair job.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: Swatinem/rust-cache@v2
        with:
          key: registry-audit

      # --all-features reaches every protocol, which means every protocol's system
      # dependency. Keep this list in sync with the "Features unavailable in Claude
      # Code for Web" table in CLAUDE.md - they are the same set for the same reason.
      - name: Install system libraries for --all-features
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libpcap-dev libdbus-1-dev libusb-1.0-0-dev libpcsclite-dev \
            libsmbclient-dev libltdl-dev
          # Not decoration. `--all-features` turns on `smb-client`, whose `pavao-sys` build
          # script shells out to pkg-config for `smbclient` and *panics* when it is absent —
          # so the whole feature set fails to build and every step below this one dies in
          # about three seconds. That is worse than a test failure: the evidence loop then
          # reports 37 protocols' clients as failed when not one of them was ever run.
          pkg-config --exists smbclient

      # The third-party clients the real-client tests drive. Every one of these tests
      # FAILS rather than skips when its binary is absent - that is what makes it
      # evidence rather than a silent pass - so a maturity rating that rests on one of
      # them can only be checked on a runner that has the binary. Add to this list
      # whenever a protocol's evidence starts depending on a new binary.
      #
      #   awscli            - sqs, dynamo, s3 (botocore; deliberately NOT the Rust
      #                       SDK the other tests use. The tests pin --endpoint-url
      #                       and dummy credentials, so nothing can reach real AWS)
      #   aria2             - torrent_tracker (aria2c)
      #   curl              - gopher, hls
      #   dict              - dict (the dictd project's dict(1) client)
      #   ignition-gemini   - gemini (a Python library, so pip rather than apt; see the
      #                       step after this one)
      #   greenstalk        - beanstalkd (a Python client library, pip; same step)
      #   nostr-sdk         - nostr (rust-nostr's Python bindings, pip; its own step)
      #   zabbix-sender     - zabbix (the Zabbix project's zabbix_sender)
      #   gearman-tools     - gearman (the gearmand project's gearman and gearadmin)
      #   (nsq release)     - nsq (to_nsq and nsq_tail; no distro packages them - see the
      #                       step that unpacks the release tarball)
      #   (otel-cli .deb,   - otlp (otel-cli from its release .deb; telemetrygen through
      #    telemetrygen)      `go install`, with the Go toolchain set up for it - see below)
      #   dnsutils (dig)    - dns
      #   ffmpeg (ffprobe)  - rtsp
      #   freeradius-utils  - radius (radclient)
      #   libcoap2-bin      - coap (coap-client, libcoap's own C client)
      #   libmemcached-tools- memcached, but under DIFFERENT NAMES - see the symlink step
      #                       below, which is what makes memcat/memstat/memping/memcp exist
      #   knot-dnsutils     - dns, doh, dot (kdig; Knot, deliberately NOT ISC dig
      #                       and NOT the hickory codec the servers encode with)
      #   mbpoll            - modbus (libmodbus's CLI master)
      #   mercurial (hg)    - mercurial
      #   mosquitto-clients - mqtt (mosquitto_pub / mosquitto_sub)
      #   mysql-client      - mysql (the real CLI; the second client, not mysql_async)
      #   npm               - npm
      #   postgresql-client - postgresql (psql; libpq, deliberately NOT tokio-postgres)
      #   python3-pip       - pypi, and oci_registry's script handler
      #   redis-tools       - redis (redis-cli; the C client, deliberately NOT redis-rs)
      #   sipsak            - sip
      #   smbclient         - smb (Samba's smbclient; NetGet's SMB server links no SMB library)
      #   smbprotocol       - smb (a Python client library, pip; its own step below)
      #   ldap-utils        - ldap (OpenLDAP ldapsearch, deliberately NOT the ldap3 crate)
      #   openssh-client    - ssh (OpenSSH, deliberately NOT libssh2, which found nothing
      #                       here for months while OpenSSH disconnected on a duplicate
      #                       SSH_MSG_CHANNEL_CLOSE one run in five)
      #   subversion (svn)  - svn (the real ra_svn client; info/ls/log)
      #   tor               - tor_relay
      #   wakeonlan         - wol
      #
      # Installed by their own steps below rather than apt: the vault CLI (vault),
      # cypher-shell (bolt; Neo4j's release zip, run on the runner image's own Java 21), and
      # nak (nostr; fiatjaf's release binary - no distro packages it).
      #
      # And the third-party SERVERS the client real-server tests drive
      # (tests/client/<p>/real_server_test.rs, spawned by tests/helpers/real_server.rs on a
      # loopback port of their own; the system services apt starts alongside are unused):
      #
      #   mosquitto         - the mqtt client (Eclipse Mosquitto, C; NetGet's client is rumqttc)
      #   nginx             - the http client (NetGet's client is reqwest/hyper)
      #   redis-server      - the redis client (NetGet frames RESP itself)
      #   memcached         - the memcached client (NetGet frames the text protocol itself;
      #                       read back with libmemcached's memcat/memcp, above)
      #   pymodbus          - the modbus client (a Python device; pip, in its own step below)
      #   coap-server       - the coap client (libcoap's example server; the same
      #                       libcoap2-bin package as coap-client, above)
      #   freeradius        - the radius client (FreeRADIUS radiusd, run unprivileged from a
      #                       minimal raddb in a temp dir). Ubuntu names the binary
      #                       `freeradius`; the step below links it to `radiusd`
      #   postgresql        - the postgresql client (the C server, initdb + postgres; NetGet's
      #                       client is tokio-postgres). Ubuntu keeps the server binaries in
      #                       /usr/lib/postgresql/<major>/bin, off PATH - real_server.rs
      #                       searches there, so nothing is symlinked
      #   mysql-server      - the mysql client (Oracle's mysqld; NetGet's client is
      #                       mysql_async). Its AppArmor profile confines it to
      #                       /var/lib/mysql, so the step after this one unloads it
      #   slapd             - the ldap client (OpenLDAP; NetGet's client is the ldap3 crate).
      #                       Run from a slapd.conf in a temp dir, not the packaged cn=config,
      #                       so the package's own debconf answers are never used. Same
      #                       AppArmor note as mysqld. ldapadd/ldapsearch are ldap-utils, above
      #   openssh-server    - the ssh client (OpenSSH sshd, run unprivileged from a temp-dir
      #                       config with public-key auth as the runner user; NetGet's client
      #                       is russh). ssh-keygen comes from openssh-client, above
      #   etcd, nats-server - release tarballs, in their own steps below
      #
      # NOT here, and each absence is load-bearing:
      #
      #   etcd-client  - jammy's is etcd **3.3.25**, whose etcdctl defaults to the **v2**
      #                  API. `etcdctl version` is not a v2 command, so it printed
      #                  "No help topic for 'version'" and exited 3, and the test's gate
      #                  refused it - correctly, because v2 is HTTP/1.1 REST and this test
      #                  exists to drive **gRPC**. Installed from the upstream release
      #                  tarball in its own step below.
      #   openvpn      - jammy's is OpenVPN **2.5.11**, and the real-client test pins the
      #                  server's fresh self-signed certificate with `--peer-fingerprint`,
      #                  which is **2.6+**. 2.5 rejects its own command line with
      #                  "Options error: Unrecognized option ... peer-fingerprint (2.5.11)"
      #                  and the test says, correctly, that nothing was tested. Installed
      #                  from jammy-backports (2.6.12) in its own step below.
      #   maven        - the runner image already has Maven **3.9.16** at /usr/bin/mvn, and
      #                  `apt-get install maven` DOWNGRADES it to jammy's 3.6.3. That is not
      #                  cosmetic: `-Dmaven.repo.local.tail`, which maven::e2e_test relies on
      #                  to resolve plugins offline while every remote is mirrored to NetGet,
      #                  arrived in Maven 3.9. Under 3.6.3 the flag is silently ignored and
      #                  the run dies with "No plugin found for prefix 'dependency' ...
      #                  available from the repositories [local, netget-under-test]" - the
      #                  tail is not in that list at all. See the warm-up step below.
      #
      # `continue-on-error` on THIS step, deliberately. An unavailable package used to abort
      # the whole job at its fifth step, so no audit and no evidence ran at all and the job
      # still reported green (it is `continue-on-error` at the job level). That is exactly
      # what happened between 2026-09-16 and 2026-09-22: `stuntman-client` is not in any
      # current Ubuntu release, apt exited 100, and this job ran nothing for six days.
      # A client that cannot be installed must surface as its own NAMED evidence failure in
      # the loop at the foot of this job - never as forty protocols' evidence silently not
      # running.
      - name: Install the third-party clients the real-client tests drive
        continue-on-error: true
        # slapd's postinst asks debconf for a domain and an admin password; without this the
        # install blocks on a prompt nobody answers.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get install -y --no-install-recommends \
            aria2 awscli capnproto curl bind9-dnsutils dict dictd dictfmt beanstalkd ffmpeg freeradius-utils \
            libcoap2-bin libmemcached-tools mbpoll mercurial \
            knot-dnsutils ldap-utils mosquitto-clients mysql-client npm openssh-client \
            postgresql-client python3-pip redis-tools sipsak smbclient \
            subversion tor wakeonlan zabbix-sender gearman-tools \
            mosquitto nginx redis-server postgresql mysql-server slapd openssh-server memcached \
            freeradius

      # Reuse the pinned independent peers from protocol-pairs.yml. Their files
      # and runtime paths stay outside the checkout to preserve the precompiled
      # all-feature evidence binaries between groups.
      - name: Install QUIC-capable Knot for DoQ evidence
        continue-on-error: true
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install knot
          printf '%s\n' '/home/linuxbrew/.linuxbrew/bin' >> "$GITHUB_PATH"

      - name: Prepare the independent NUT server and clients
        continue-on-error: true
        run: |
          sh scripts/test-peers/build-nut.sh "$RUNNER_TEMP/netget-pair-peers/nut"
          {
            printf 'NUT_UPSC_BIN=%s/netget-pair-peers/nut/nut-2.8.4/clients/upsc\n' "$RUNNER_TEMP"
            printf 'NUT_UPSCMD_BIN=%s/netget-pair-peers/nut/nut-2.8.4/clients/upscmd\n' "$RUNNER_TEMP"
            printf 'NUT_UPSD_BIN=%s/netget-pair-peers/nut/nut-2.8.4/server/upsd\n' "$RUNNER_TEMP"
            printf 'NUT_DUMMY_BIN=%s/netget-pair-peers/nut/nut-2.8.4/drivers/dummy-ups\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Configure isolated StatsD and Graphite peer paths
        run: |
          {
            printf 'PYTHONPATH=%s/netget-pair-peers/statsd-python:%s/netget-pair-peers/graphite-python:%s/netget-pair-peers/graphite-python/opt/graphite/lib\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP"
            printf 'NODE_PATH=%s/netget-pair-peers/statsd-node/node_modules\n' "$RUNNER_TEMP"
            printf 'NETGET_GRAPHITE_PYTHON=python3\n'
          } >> "$GITHUB_ENV"

      - name: Prepare the independent StatsD emitters and collector
        continue-on-error: true
        run: python3 tests/server/statsd/install_peers.py "$RUNNER_TEMP/netget-pair-peers"

      - name: Prepare the independent Graphite emitter and Carbon collector
        continue-on-error: true
        run: python3 tests/server/graphite/install_peers.py "$RUNNER_TEMP/netget-pair-peers"

      - name: Prepare the independent DoQ server
        continue-on-error: true
        run: |
          sh scripts/test-peers/install-dnsproxy.sh "$RUNNER_TEMP/netget-pair-peers/dnsproxy"
          printf 'NETGET_DNSPROXY_BIN=%s/netget-pair-peers/dnsproxy/linux-amd64/dnsproxy\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Prepare the independent Gemini server
        continue-on-error: true
        run: |
          sh scripts/test-peers/fetch-agate.sh "$RUNNER_TEMP/netget-pair-peers/agate"
          printf 'NETGET_TEST_AGATE=%s/netget-pair-peers/agate/agate-3.3.24\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Prepare the independent raw QUIC peer
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/netget-pair-peers/aioquic"
          "$RUNNER_TEMP/netget-pair-peers/aioquic/bin/pip" install --no-cache-dir --only-binary=:all: aioquic==1.3.0
          printf 'NETGET_AIOQUIC_PYTHON=%s/netget-pair-peers/aioquic/bin/python\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      # jammy's libcoap2-bin is 4.2.1, whose example coap-server has no `example_data`
      # resource (it arrived in 4.3), so client/coap::real_server_test got 4.04 for every PUT
      # and GET. Build 4.3.5 without DTLS into /usr/local, which precedes /usr/bin on PATH, so
      # coap-server and coap-client both come from it; coap's own server evidence uses the same
      # coap-client. A build that names the binaries with a TLS suffix is linked to the plain
      # name, and the final check fails this step if either is still the packaged 4.2.1.
      - name: Build libcoap 4.3.5 (coap-server's example_data resource)
        continue-on-error: true
        run: |
          git clone --quiet --depth 1 --branch v4.3.5 https://github.com/obgm/libcoap.git /tmp/libcoap
          cmake -S /tmp/libcoap -B /tmp/libcoap/build -DENABLE_DTLS=OFF -DENABLE_DOCS=OFF \
            -DENABLE_EXAMPLES=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/libcoap/build -j"$(nproc)"
          sudo cmake --install /tmp/libcoap/build
          sudo ldconfig
          for tool in coap-server coap-client; do
            if [ ! -x "/usr/local/bin/$tool" ]; then
              suffixed=$(ls /usr/local/bin/"$tool"-* 2>/dev/null | head -1)
              [ -n "$suffixed" ] && sudo ln -sf "$suffixed" "/usr/local/bin/$tool"
            fi
            echo "$tool -> $(command -v $tool)"
            [ "$(command -v $tool)" = "/usr/local/bin/$tool" ] || { echo "$tool is not the 4.3.5 build" >&2; exit 1; }
          done

      # Ubuntu ships AppArmor profiles that confine these daemons to their packaged paths:
      # mysqld to /var/lib/mysql, slapd to /etc/ldap and /var/lib/ldap. The client real-server
      # tests run each one unprivileged against a data directory in a fresh temp dir, which the
      # profile refuses - mysqld's --initialize fails on its first write. Unloading the profile
      # affects only this throwaway runner. `continue-on-error` like the installs above: a
      # missing profile must cost at most those two protocols' evidence.
      - name: Unload the AppArmor profiles that confine mysqld and slapd
        continue-on-error: true
        run: |
          for profile in usr.sbin.mysqld usr.sbin.slapd; do
            if [ -f "/etc/apparmor.d/$profile" ]; then
              sudo apparmor_parser -R "/etc/apparmor.d/$profile" || true
            fi
          done

      # nsq::real_client_test drives to_nsq and nsq_tail, the NSQ project's own go-nsq clients.
      # No distro packages them; the release tarball carries static binaries under bin/, which
      # --strip-components=1 puts in /usr/local/bin where the test's require_tool looks first.
      - name: Install the NSQ clients (to_nsq, nsq_tail)
        continue-on-error: true
        run: |
          curl -fsSL https://github.com/nsqio/nsq/releases/download/v1.3.0/nsq-1.3.0.linux-amd64.go1.21.5.tar.gz \
            | sudo tar -xz -C /usr/local --strip-components=1
          command -v to_nsq nsq_tail

      # otlp::real_client_test drives two OpenTelemetry exporters: otel-cli (its release .deb)
      # and the Collector project's telemetrygen, which is only published as a Go module. The
      # Go setup step exists for it; the version is pinned so the evidence is reproducible.
      - uses: actions/setup-go@v5
        continue-on-error: true
        with:
          go-version: stable
          cache: false
      - name: Install the OTLP clients (otel-cli, telemetrygen)
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/otel-cli.deb \
            https://github.com/equinix-labs/otel-cli/releases/download/v0.4.5/otel-cli_0.4.5_linux_amd64.deb
          sudo dpkg -i /tmp/otel-cli.deb
          GOBIN="$HOME/go-tools" go install \
            github.com/open-telemetry/opentelemetry-collector-contrib/cmd/telemetrygen@v0.161.0
          sudo install -m 0755 "$HOME/go-tools/telemetrygen" /usr/local/bin/telemetrygen
          command -v otel-cli telemetrygen

      # gemini::real_client_test drives `ignition`, a Python Gemini client library (TLS through
      # CPython's ssl/OpenSSL, trust-on-first-use pinning, its own response parser). No distro
      # packages it, so it comes from PyPI into the python3 the test spawns; the import check
      # makes a failed install surface here rather than as gemini's evidence silently absent.
      - name: Install the Gemini client library (ignition)
        continue-on-error: true
        run: |
          python3 -m pip install --user ignition-gemini==1.0.0
          python3 -c "import ignition; print('ignition', ignition.__version__)"

      # nostr::real_client_test drives two clients: nak (fiatjaf's Go client, the release
      # binary - no distro packages it) and rust-nostr's Python bindings (nostr-sdk, PyPI).
      # Both checks make a failed install surface here rather than as nostr's evidence
      # silently absent. The test also runs the pcap oracle (http + websocket dissectors).
      - name: Install the Nostr clients (nak, nostr-sdk)
        continue-on-error: true
        run: |
          set -eux
          sudo curl -fsSL -o /usr/local/bin/nak \
            https://github.com/fiatjaf/nak/releases/download/v0.20.7/nak-v0.20.7-linux-amd64
          sudo chmod +x /usr/local/bin/nak
          nak --version
          python3 -m pip install --user nostr-sdk==0.45.1
          python3 -c "import nostr_sdk; print('nostr-sdk imported')"

      # gemini::real_client_test also runs the pcap oracle over the TLS it recorded, and the
      # oracle FAILS rather than skips without tshark. jammy's tshark 3.6 has the `tls`
      # dissector that check needs; only the Test job's redis case needs >= 4.0 (`resp`).
      # The preseed answers the capture-permission prompt that would otherwise hang the job.
      - name: install tshark 4.x (the pcap oracle in the Gemini, Zabbix and SMB evidence)
        continue-on-error: true
        run: |
          # jammy's own tshark is 3.6, which has no `zabbix` dissector (zabbix's evidence runs
          # the oracle too); the Wireshark stable PPA carries 4.x for jammy.
          sudo add-apt-repository -y ppa:wireshark-dev/stable
          sudo apt-get update
          echo "wireshark-common wireshark-common/install-setuid boolean false" \
            | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
          tshark --version | head -1
          tshark -G protocols | awk -F'\t' '$3=="zabbix"{f=1} END{if(!f){print "no zabbix dissector in this tshark" > "/dev/stderr"; exit 1}}'

      # beanstalkd::real_client_test drives `greenstalk`, a Python beanstalkd client with its
      # own reply parser and YAML reader. PyPI only, like ignition; the import check names a
      # failed install here.
      - name: Install the Beanstalkd client library (greenstalk)
        continue-on-error: true
        run: |
          python3 -m pip install --user greenstalk==2.1.1
          python3 -c "import greenstalk; print('greenstalk', greenstalk.__version__)"

      # smb::real_client_test's second client is `smbprotocol`, a Python SMB2 implementation
      # (Direct TCP framing, NTLMSSP through pyspnego, its own response parsing). PyPI only,
      # like ignition; the import check names a failed install here.
      - name: Install the SMB client library (smbprotocol)
        continue-on-error: true
        run: |
          python3 -m pip install --user 'smbprotocol==1.17.*'
          python3 -c "import smbprotocol, smbclient; print('smbprotocol ok')"

      # redis::resp3_test's second RESP3 client is redis-py 5 with protocol=3: its own
      # pure-Python RESP3 parser, credentials sent inside HELLO, and a push handler.
      - name: Install the Redis client library (redis-py)
        continue-on-error: true
        run: |
          python3 -m pip install --user 'redis==5.2.*'
          python3 -c "import redis; print('redis-py', redis.__version__)"

      # client/modbus::real_server_test runs a pymodbus 3.15 device (its own framer and
      # datastore, in Python; NetGet's Modbus client frames with NetGet's codec) and reads what
      # the model wrote back with mbpoll, installed above. 3.15 because the test's device script
      # uses the SimData/SimDevice API that replaced ModbusSlaveContext; the import check makes
      # a failed install surface here rather than as the modbus client's evidence absent.
      - name: Install the Modbus device library (pymodbus)
        continue-on-error: true
        run: |
          python3 -m pip install --user 'pymodbus==3.15.*'
          python3 -c "import pymodbus; from pymodbus.simulator import SimDevice; print('pymodbus', pymodbus.__version__)"

      # Debian and Ubuntu ship libmemcached's client tools under a `memc` prefix -
      # `memccat`, `memcstat`, `memcping`, `memccp` - while libmemcached's own build and Homebrew's
      # bottle install them as `memcat`, `memstat`, `memping`, `memcp`, which is what the tests
      # invoke and what upstream's manpages call them. `libmemcached-tools` really was
      # installed on every run since this list was written; it simply never contained a
      # file called `memstat`, so the test reported the binary missing and memcached's
      # Beta rating went unchecked.
      #
      # Symlinked rather than taught to the test, following the `kcat`/`kafkacat` step
      # below: a test that guesses between packaging spellings is a test that can silently
      # drive the wrong thing.
      - name: Give libmemcached's tools the names upstream uses
        continue-on-error: true
        run: |
          set -eux
          for pair in memcat:memccat memstat:memcstat memping:memcping memcp:memccp ; do
            sudo ln -sf "/usr/bin/${pair##*:}" "/usr/local/bin/${pair%%:*}"
          done
          # Not decoration: these run the binaries, so a rename or a dropped tool in a
          # future libmemcached-tools fails HERE, in one line, rather than as memcached's
          # evidence quietly not running.
          memcat --version
          memstat --version
          memping --version
          memcp --version

      # Ubuntu installs FreeRADIUS's server as /usr/sbin/freeradius; upstream, Homebrew and
      # the test call it `radiusd`. Linked, like libmemcached's tools above, rather than
      # taught to the test: a test that guesses between spellings can drive the wrong thing.
      - name: Give FreeRADIUS's server the name upstream uses
        continue-on-error: true
        run: |
          set -eux
          sudo ln -sf /usr/sbin/freeradius /usr/local/bin/radiusd
          radiusd -v | head -1

      # OpenVPN 2.6 from jammy-backports - see the note above. `--peer-fingerprint`, the
      # option `tests/server/openvpn/e2e_test.rs` uses to trust the server's per-run
      # self-signed certificate without any PKI, does not exist in jammy's 2.5.11, so the
      # client refused its own command line and the test reported that nothing was tested.
      #
      # jammy-backports rather than OpenVPN's own apt repository: 2.6.12 is there already,
      # it is signed by the same archive key everything else in this job comes from, and
      # adding a third-party repository to a CI image is a decision that deserves more than
      # a test fix. `-t jammy-backports` raises that pocket's priority for this invocation
      # only.
      #
      # `continue-on-error` for the same reason as the apt step above.
      - name: Install OpenVPN 2.6 (jammy-backports)
        continue-on-error: true
        run: |
          set -eux
          sudo apt-get install -y --no-install-recommends -t jammy-backports openvpn
          openvpn --version | head -1
          # The assertion is the exact option the test passes, not the version string: a
          # backport that dropped it would satisfy "2.6" and still fail inside the test.
          #
          # It is checked by *offering* the option, because `--help` does not list it -
          # measured on 2.6.12, `openvpn --help | grep peer-fingerprint` finds nothing, and
          # neither does the installed man page. What does discriminate is the parser: 2.6
          # accepts the option and rejects the value ("hash fingerprint is wrong length -
          # expected 32 bytes"), while 2.5.11 says "Unrecognized option ... peer-fingerprint",
          # which is the exact line the test died on. A deliberately too-short fingerprint
          # therefore separates the two without needing a real certificate.
          if openvpn --peer-fingerprint AA:BB 2>&1 | grep -q 'Unrecognized option' ; then
            echo "this openvpn does not know --peer-fingerprint, so" \
                 "server::openvpn::e2e_test cannot test anything - it needs 2.6+" >&2
            exit 1
          fi

      # etcdctl, from the upstream release rather than apt - see the note above: jammy's
      # `etcd-client` is 3.3.25 and defaults to the v2 (HTTP/1.1 REST) API, which is not
      # the client this test exists to drive. 3.5 defaults to v3, and its clientv3 is
      # grpc-go, which is the whole point: tonic accepted the trailers bug that grpc-go
      # refuses, so etcd's Beta rests on a client that is NOT tonic.
      #
      # `continue-on-error` for the same reason as the apt step: a download that 404s must
      # cost etcd's evidence, not everybody else's.
      #
      # The same tarball carries the `etcd` server, which the etcd CLIENT's real-server test
      # (tests/client/etcd/real_server_test.rs) spawns: Go and grpc-go, where NetGet's client
      # is etcd-client on tonic. That test reads the client port out of 3.5's
      # "serving client traffic insecurely" log line, checked against 3.5.17.
      - name: Install etcd and etcdctl (etcd 3.5, the v3/gRPC server and client)
        continue-on-error: true
        run: |
          set -eux
          curl -fsSL -o /tmp/etcd.tgz \
            https://github.com/etcd-io/etcd/releases/download/v3.5.17/etcd-v3.5.17-linux-amd64.tar.gz
          sudo tar -xzf /tmp/etcd.tgz -C /usr/local/bin --strip-components=1 \
            etcd-v3.5.17-linux-amd64/etcdctl etcd-v3.5.17-linux-amd64/etcd
          # The test's own gate is `etcdctl version`, and it is the exact invocation that
          # exited 3 under 3.3.25. Asserting it here means a client in the wrong API mode
          # fails this step rather than one protocol's test.
          etcdctl version
          etcd --version

      # nats-server, which the nats CLIENT's Beta rests on (tests/client/nats/e2e_test.rs
      # spawns it with `-a 127.0.0.1 -p -1`). Upstream's release tarball rather than apt, so
      # the version is pinned rather than whatever the image's archive carries.
      # `continue-on-error` for the same reason as the apt step.
      - name: Install nats-server
        continue-on-error: true
        run: |
          set -eux
          curl -fsSL -o /tmp/nats.tgz \
            https://github.com/nats-io/nats-server/releases/download/v2.10.24/nats-server-v2.10.24-linux-amd64.tar.gz
          sudo tar -xzf /tmp/nats.tgz -C /usr/local/bin --strip-components=1 \
            nats-server-v2.10.24-linux-amd64/nats-server
          nats-server --version

      # stuntman's `stunclient` drives `stun::real_client_test`, and it is built here rather
      # than installed because it is in NO current apt repository: the `stuntman-client`
      # package existed in Ubuntu xenial and bionic only, was dropped before focal, and is
      # absent from Debian too. The apt line above claimed it was in jammy universe, which is
      # what killed this job for six days.
      #
      # `continue-on-error` for the same reason as the apt step: a build failure must cost
      # stun's evidence, not everybody else's.
      #
      # **A commit on master, not the newest tag, and that is the whole fix.** stuntman's
      # last tag is `version1.2.13` (2015) and it does not compile against OpenSSL 1.1 or
      # later: `stuncore/stunreader.cpp` declares `HMAC_CTX ctx = {}` by value and calls
      # `HMAC_CTX_init`/`HMAC_CTX_cleanup`, all of which OpenSSL 1.1 removed when the struct
      # became opaque. On jammy (OpenSSL 3.0) that is three hard errors, `make` stops before
      # linking anything, `sudo install` never runs, and - because this step is
      # continue-on-error - the step reported success having produced no binary. stun's test
      # then failed with "stunclient not available (No such file or directory)", which reads
      # like a missing package and is actually a compile error thirty lines earlier.
      #
      # Upstream fixed it on master long ago but has cut no release since, so a pinned SHA is
      # the only honest choice: a floating `master` would make this job's result depend on
      # someone else's unreleased work. Re-pin deliberately if stuntman ever tags again.
      - name: Build stuntman's stunclient from source
        continue-on-error: true
        run: |
          set -eux
          sudo apt-get install -y --no-install-recommends libboost-dev libssl-dev g++ make
          # A full clone: `--depth 1` cannot check out an arbitrary SHA, and the repository
          # is under 10 MB.
          git clone https://github.com/jselbie/stunserver.git /tmp/stunserver
          cd /tmp/stunserver
          git checkout 1582042ca33f747f88101fbadec4944714aa8bbb
          make -j"$(nproc)"
          # The Makefile leaves the binaries in the tree rather than an install prefix, and
          # which subdirectory has moved between releases - so find it rather than guess.
          client=$(find /tmp/stunserver -maxdepth 2 -type f -name stunclient -perm -u+x | head -1)
          test -n "$client"
          sudo install -m 0755 "$client" /usr/local/bin/stunclient
          # Not decoration, and not `command -v`: a build that half-succeeded, or a `find`
          # that picked up something else called stunclient, both satisfy presence. This runs
          # the binary and asserts it identifies itself as stuntman's client. (`--help` exits
          # 254 by design, so the exit status is deliberately not what is checked - `grep -q`
          # is, and the pipeline's status is grep's.)
          stunclient --help 2>&1 | grep -q 'command line app for the STUN protocol'

      # Not in apt on ubuntu-22.04.
      #   crane    - oci_registry
      #   grpcurl  - grpc (grpc-go; deliberately NOT tonic, which the server links)
      #   websocat - websocket (rust-websocket, deliberately NOT tungstenite)
      #   mongosh  - mongodb (MongoDB's own shell, on the Node.js driver)
      # `continue-on-error` for the same reason as the apt step above: one download
      # that 404s must cost its own protocol's evidence, not the whole job.
      - name: Install crane, grpcurl, websocat and mongosh
        continue-on-error: true
        run: |
          set -eux
          curl -fsSL -o /tmp/crane.tgz \
            https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz
          sudo tar -xzf /tmp/crane.tgz -C /usr/local/bin crane
          curl -fsSL -o /tmp/grpcurl.tgz \
            https://github.com/fullstorydev/grpcurl/releases/download/v1.9.1/grpcurl_1.9.1_linux_x86_64.tar.gz
          sudo tar -xzf /tmp/grpcurl.tgz -C /usr/local/bin grpcurl
          sudo curl -fsSL -o /usr/local/bin/websocat \
            https://github.com/vi/websocat/releases/download/v1.14.0/websocat.x86_64-unknown-linux-musl
          sudo chmod +x /usr/local/bin/websocat
          curl -fsSL -o /tmp/mongosh.tgz \
            https://downloads.mongodb.com/compass/mongosh-2.3.8-linux-x64.tgz
          sudo tar -xzf /tmp/mongosh.tgz -C /usr/local --strip-components=1 \
            mongosh-2.3.8-linux-x64/bin/mongosh
          crane version
          grpcurl --version
          websocat --version
          mongosh --version

      # promtool and prometheus drive prometheus::real_client_test. The upstream release
      # rather than apt: jammy's `prometheus` package is 2.31, which predates Prometheus 3's
      # scrape_protocols spelling the test pins, and it would put a daemon unit on the runner.
      # `continue-on-error` for the same reason as the apt step above.
      - name: Install prometheus and promtool (upstream release)
        continue-on-error: true
        run: |
          set -eux
          curl -fsSL -o /tmp/prometheus.tgz \
            https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz
          sudo tar -xzf /tmp/prometheus.tgz -C /usr/local/bin --strip-components=1 \
            prometheus-3.5.0.linux-amd64/prometheus prometheus-3.5.0.linux-amd64/promtool
          prometheus --version
          promtool --version

      # docker::real_client_test drives the docker CLI only - never a daemon: every call
      # passes -H tcp://127.0.0.1:<netget port> with DOCKER_HOST/DOCKER_CONTEXT removed and a
      # temp DOCKER_CONFIG. GitHub's ubuntu images ship the CLI; this asserts it is there so a
      # missing binary fails here rather than inside the test.
      - name: Check the docker CLI is present
        continue-on-error: true
        run: |
          set -eux
          docker --version

      # The vault CLI drives vault::real_client_test. HashiCorp's release zip rather than
      # its apt repository, which would also install and enable a vault server unit. The test
      # runs the CLI with a cleared environment and a temp HOME, against NetGet only.
      # `continue-on-error` for the same reason as the apt step above.
      - name: Install the vault CLI (HashiCorp release)
        continue-on-error: true
        run: |
          set -eux
          curl -fsSL -o /tmp/vault.zip \
            https://releases.hashicorp.com/vault/1.18.3/vault_1.18.3_linux_amd64.zip
          sudo unzip -o /tmp/vault.zip vault -d /usr/local/bin
          vault version

      # cypher-shell drives bolt::real_client_test. The smallest route on Ubuntu is Neo4j's
      # release zip (~45 MB, the same artifact Homebrew installs): Neo4j's apt repository
      # would need its signing key and source list, and its `cypher-shell` package pulls a JRE
      # the image already has. cypher-shell 2026.x needs Java 21, which the ubuntu-22.04
      # image ships as JAVA_HOME_21_X64; the wrapper points the launcher at it so the job's
      # default JAVA_HOME (used by maven) is left alone.
      # `continue-on-error` for the same reason as the apt step above.
      - name: Install cypher-shell (Neo4j release zip)
        continue-on-error: true
        run: |
          set -eux
          curl -fsSL -o /tmp/cypher-shell.zip \
            https://dist.neo4j.org/cypher-shell/cypher-shell-2026.09.0.zip
          sudo unzip -q -o /tmp/cypher-shell.zip -d /opt
          printf '%s\n' '#!/bin/sh' \
            'JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}" exec /opt/cypher-shell-2026.09.0/bin/cypher-shell "$@"' \
            | sudo tee /usr/local/bin/cypher-shell > /dev/null
          sudo chmod +x /usr/local/bin/cypher-shell
          cypher-shell --version

      # kcat drives the kafka real-client test. ubuntu-22.04 still ships it under the
      # pre-rename package name `kafkacat`, whose binary may be either `kcat` or
      # `kafkacat` depending on the build - the test invokes `kcat`, so symlink when
      # only the old name is present rather than making the test guess.
      # `continue-on-error` for the same reason as the apt step above: one download
      # that 404s must cost its own protocol's evidence, not the whole job.
      - name: Install kcat (librdkafka CLI)
        continue-on-error: true
        run: |
          set -eux
          sudo apt-get install -y --no-install-recommends kafkacat
          if ! command -v kcat ; then
            sudo ln -s "$(command -v kafkacat)" /usr/local/bin/kcat
          fi
          kcat -V

      # `maven::e2e_test` drives the real `mvn`, and it resolves the dependency plugin from
      # `~/.m2/repository` on purpose: every remote repository is mirrored to NetGet for the
      # duration of the test, so a plugin that is not already cached cannot be fetched at all
      # and the test would either fail or - worse - reach Maven Central, which this
      # repository's tests may never do. A GitHub runner's `~/.m2` does not exist until
      # something warms it, so the test failed on its own explicit check, which names this
      # step's command.
      #
      # Two things have to be true and only one of them is the cache:
      #
      #  * **Maven must be >= 3.9.** The split local repository (`-Dmaven.repo.local.tail`),
      #    which is how the test reads that cache while writing into a throwaway head, landed
      #    in Maven 3.9. Under 3.6.3 the flag is not an error - it is IGNORED - and the run
      #    dies with `No plugin found for prefix 'dependency' ... available from the
      #    repositories [local (...), netget-under-test (...)]`, a list with no tail in it.
      #    The runner image ships 3.9.16; the apt `maven` package (3.6.3) used to be
      #    installed above and overwrote it, so this job was downgrading itself into the bug.
      #    The assertion below is what stops that returning silently.
      #  * **`dependency:get` AND `dependency:unpack`** are both driven by the test, so both
      #    are warmed here. They are one plugin, and resolving a plugin resolves its whole
      #    realm, but warming exactly what the test runs costs seconds and leaves nothing to
      #    reason about.
      #
      # `continue-on-error` for the same reason as the apt step above.
      - name: Warm ~/.m2 for maven::e2e_test
        continue-on-error: true
        run: |
          set -eux
          mvn -version
          # Fail here, loudly, rather than inside a protocol test that cannot explain why.
          mvn_version=$(mvn -version | head -1 | awk '{print $3}')
          case "$mvn_version" in
            3.9.*|3.1[0-9].*|[4-9].*)
              echo "maven $mvn_version supports the split local repository" ;;
            *)
              echo "maven $mvn_version is too old: maven::e2e_test needs" \
                   "-Dmaven.repo.local.tail, which arrived in Maven 3.9. Do NOT install the" \
                   "apt 'maven' package in this job - it downgrades the image's 3.9.x." >&2
              exit 1 ;;
          esac
          # The plugin the test resolves offline. This is the one command in this job that
          # deliberately contacts Maven Central, and it happens before any server is started.
          mvn -B dependency:get -Dartifact=junit:junit:4.13.2
          mvn -B dependency:unpack -Dartifact=junit:junit:4.13.2 \
            -DoutputDirectory=/tmp/m2-warmup-unpack
          # The exact directory maven::e2e_test checks for, so a future Maven that resolves a
          # different plugin coordinate fails here instead of there.
          test -d "$HOME/.m2/repository/org/apache/maven/plugins/maven-dependency-plugin"

      # Each of these asserts something about EVERY registered protocol: that no event
      # is advertised without usable actions, that no response example is left as a
      # placeholder, that keyword resolution is unambiguous, that declared dependencies
      # and privilege requirements are coherent, and — protocol_startup_smoke_test —
      # that every protocol can actually be started through the real startup path,
      # reports an honest status, and releases its socket on stop. That last one is the
      # only job here that runs protocol code rather than reading its declarations.
      - name: cargo test --all-features (registry audits)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          echo "::notice::Advisory only. Covers all registered protocols, not just CI_FEATURES."
          # --no-fail-fast: without it one failing target hides every target after it, which is
          # how a CalDAV keyword clash silently cut this audit short for weeks.
          cargo test --locked --all-features --no-fail-fast \
            --test event_action_declarations_test \
            --test placeholder_examples_test \
            --test base_stack_test \
            --test advertised_actions_test \
            --test protocol_dependencies_test \
            --test privilege_requirement_test \
            --test startup_privilege_transport_test \
            --test protocol_startup_smoke_test \
            --test connectionless_audit_test \
            -- --test-threads=100 --nocapture

      # The generated evidence table. It reads source only, so it needs no build and
      # no binaries — but it is here because this is the job that is about ratings.
      # Advisory: a Beta whose peer this scan cannot find may be over-rated OR may be
      # driving its client in a way a static read cannot see, and the script says so
      # rather than guessing.
      - name: Beta evidence table
        continue-on-error: true
        run: |
          echo "::notice::Generated from source. CLAUDE.md's hand-maintained list has been wrong three times."
          python3 scripts/beta_evidence_table.py --all
          python3 scripts/beta_evidence_table.py --experimental-with-evidence

      # `mercurial` and `wol` are Experimental, so strictly they need not be here; they are
      # because the test exists, is not #[ignore]d, and costs a few seconds. `ollama` is the
      # reason the three were noticed at all — a Beta whose real-client test this loop did not
      # run, which is the hole the loop exists to close, found by diffing
      # `tests/server/*/real_client_test.rs` against this list rather than by reading it.
      #
      # The real-client evidence itself. These are the tests every Beta rating that
      # names a binary rests on, and this is the only job with those binaries, so it
      # is the only place they can run. Each one fails (never skips) when its client
      # is missing, so a green run here means the client really was driven.
      # Still advisory, but it now reports an honest verdict. It previously swallowed
      # failures TWICE - `continue-on-error` on the job and `|| echo ::warning::` on each
      # filter - so the step went green even when a real client had failed outright. That
      # defeats the point of converting these gates from skip-to-fail: the whole reason a
      # missing client is now an error is so somebody learns about it.
      #
      # The loop still runs every filter rather than stopping at the first failure, because
      # one run should tell you everything that is broken. It just remembers, and exits
      # non-zero at the end.
      #
      # The broad audit remains advisory until it has completed cleanly three times.
      # Making it blocking requires removing BOTH the job and step continue-on-error.
      # SMB has its own blocking job below so its Stable evidence cannot hide here.
      - name: Compile real-client evidence before starting its execution budget
        id: evidence-build
        continue-on-error: true
        timeout-minutes: 35
        run: cargo test --locked --all-features --test server --test client --no-run

      - name: cargo test --all-features (real-client evidence)
        if: steps.evidence-build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -o pipefail
          echo "::notice::These are the real-client tests behind the Beta ratings."
          # Written to the run summary, not just the log. This job is `continue-on-error`
          # at JOB level, so it reports green whatever happens inside it — which is how it
          # sat dead for six days on a missing apt package with nobody noticing, and how a
          # later `--all-features` build failure did the same. A log nobody opens is not a
          # signal; the summary is on the run's own page.
          mkdir -p "$EVIDENCE_DIR"
          failed=""
          for filter in \
            bolt::real_client_test \
            coap::real_client_test dict::real_client_test dns::dig_test dns::kdig_test \
            gemini::real_client_test beanstalkd::real_client_test zabbix::real_client_test \
            gearman::real_client_test nsq::real_client_test nostr::real_client_test \
            docker::real_client_test doh::real_client_test dot::real_client_test doq::e2e_test dynamo::real_client_test \
            etcd::real_client_test git::e2e_test gopher::e2e_test grpc::real_client_test \
            hls::curl_test http::real_client_test imap::real_client_test \
            kafka::real_client_test kubernetes::e2e_test ldap::real_client_test \
            maven::e2e_test \
            memcached::real_client_test modbus::real_client_test \
            mongodb::real_client_test mqtt::real_client_test \
            mercurial::real_client_test mysql::real_client_test npm::e2e_test nut::real_client_test \
            oci_registry::e2e_test ollama::real_client_test openvpn:: \
            postgresql::real_client_test \
            prometheus::real_client_test otlp::real_client_test \
            pypi::e2e_test quic::independent_peer_test radius::real_client_test redis::real_client_test redis::resp3_test \
            redis::pubsub_test redis::cluster_test redis::keys_oracle_test \
            rtsp::ffprobe_test s3::real_client_test sip::real_client_test \
            smb::real_client_test statsd::real_client_test graphite::real_client_test \
            sqs::real_client_test ssh::real_client_test stun::real_client_test \
            svn::real_client_test \
            torrent_tracker::real_client_test vault::real_client_test webdav::real_client_test \
            websocket::e2e_test \
            wol::real_client_test \
            client/beanstalkd::real_server_test client/dict::real_server_test \
            client/doq::real_server_test client/etcd::real_server_test \
            client/gemini::real_server_test client/graphite::real_server_test client/http::real_server_test \
            client/ldap::real_server_test \
            client/coap::real_server_test \
            client/memcached::real_server_test client/modbus::real_server_test \
            client/radius::real_server_test \
            client/mqtt::keepalive_test client/mqtt::real_server_test \
            client/mysql::real_server_test client/nats::e2e_test client/nut::real_server_test \
            client/postgresql::real_server_test \
            client/quic::real_server_test client/redis::real_server_test \
            client/redis::pubsub_real_server_test client/redis::cluster_real_server_test \
            client/ssh::real_server_test client/statsd::real_server_test ; do
            echo "::group::$filter"
            # `client/<p>::<file>` is a NetGet CLIENT against a real third-party server, run
            # from the `client` test target; everything else is a real client against a
            # NetGet server, from `server`.
            target=server
            test_filter="$filter"
            case "$filter" in
              client/*) target=client ; test_filter="${filter#client/}" ;;
            esac
            result_file="$EVIDENCE_DIR/${filter//[:\/]/_}"
            printf 'running\t%s\n' "$filter" > "$result_file.status"
            # Each group has a bounded runtime; a stuck client cannot consume the whole
            # job. pipefail keeps cargo/timeout failure visible through tee. A renamed
            # filter running zero tests is a failure too, never evidence of success.
            if timeout --signal=TERM --kill-after=10s 5m \
                 cargo test --locked --all-features --test "$target" -- \
                 --test-threads=32 --nocapture "$test_filter" 2>&1 | tee "$result_file.log" \
                 && grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$result_file.log"; then
              printf 'passed\t%s\n' "$filter" > "$result_file.status"
            else
              printf 'FAILED\t%s\n' "$filter" > "$result_file.status"
              echo "::error::$filter failed or ran no tests - a Beta rating rests on this test"
              failed="$failed $filter"
            fi
            echo "::endgroup::"
          done
          touch "$EVIDENCE_DIR/complete"
          if [ -n "$failed" ]; then
            echo "::error::real-client evidence failed for:$failed"
            exit 1
          fi

      # Browser interoperability uses the same all-feature binary and nak installation.
      # A native WebSocket client cannot prove browser CORS or the browser's close handshake.
      - name: Install Chromium for Nostr browser evidence
        id: nostr-browser-setup
        if: steps.evidence-build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          npm install --prefix "$RUNNER_TEMP/netget-browser-evidence" \
            --no-save --no-audit --no-fund playwright@1.57.0
          node "$RUNNER_TEMP/netget-browser-evidence/node_modules/playwright/cli.js" \
            install --with-deps chromium

      - name: Nostr real-browser evidence (Chromium)
        id: nostr-browser
        if: steps.evidence-build.outcome == 'success' && steps.nostr-browser-setup.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -o pipefail
          mkdir -p "$EVIDENCE_DIR"
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/netget-browser-evidence/node_modules/playwright/index.mjs" \
            NETGET_BIN=target/debug/netget node web/test/nostr_browser.mjs \
            2>&1 | tee "$EVIDENCE_DIR/nostr-browser.log"

      - name: Summarize real-client evidence even after interruption
        if: always()
        env:
          EVIDENCE_BUILD: ${{ steps.evidence-build.outcome }}
          NOSTR_BROWSER_SETUP: ${{ steps.nostr-browser-setup.outcome }}
          NOSTR_BROWSER: ${{ steps.nostr-browser.outcome }}
        run: python3 .github/scripts/summarize-evidence.py

      - name: Preserve real-client evidence logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-client-evidence
          path: ${{ runner.temp }}/netget-real-client-evidence/
          if-no-files-found: warn
          retention-days: 14

  smb-evidence:
    name: SMB stable evidence
    # Manual runs only (Actions → Run workflow): too heavy for every push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: smb-evidence
      - name: Install both independent clients and the packet oracle
        run: |
          sudo apt-get update
          echo "wireshark-common wireshark-common/install-setuid boolean false" \
            | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            smbclient tshark python3-venv
          python3 -m venv "$RUNNER_TEMP/smb-evidence-venv"
          "$RUNNER_TEMP/smb-evidence-venv/bin/pip" install 'smbprotocol==1.17.*'
          echo "$RUNNER_TEMP/smb-evidence-venv/bin" >> "$GITHUB_PATH"
          smbclient --version
          tshark --version | head -1
      - name: Verify SMB framing, bounds, independent clients, and packet decoding
        timeout-minutes: 30
        run: |
          set -o pipefail
          python3 -c 'import smbprotocol, smbclient'
          mkdir -p evidence-results
          cargo test --locked --no-default-features \
            --lib --test server -- smb:: --test-threads=32 --nocapture \
            2>&1 | tee evidence-results/smb.log
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' evidence-results/smb.log
      - name: Preserve SMB evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smb-stable-evidence
          path: evidence-results/
          if-no-files-found: warn
          retention-days: 14

  test:
    name: Test (${{ matrix.part }})
    # ubuntu-24.04, not 22.04, and the reason is tshark. `tests/helpers/pcap_oracle.rs`
    # asks Wireshark to decode Redis with the `resp` dissector, and `resp` was added in
    # **Wireshark 4.0.0** (MR 6458, March 2022). jammy ships 3.6.2; noble ships 4.2.2.
    # There is no older name to fall back to - Wireshark never had a built-in `redis`
    # dissector, only third-party Lua ones - so on 22.04 `server::redis::resp_framing_test`
    # could only fail with `tshark: Unknown protocol -- "resp"`, which is what it did.
    #
    # Checked at the same time: `resp` is the ONLY one of the 59 dissector names in
    # `src/tui/wireshark.rs` that needs Wireshark >= 4.0. Every other name has fields
    # going back to 3.6 or earlier, so nothing else in that table was riding on this.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The top-level targets split five ways (scripts/test_batches.sh's SHARD), and the
    # CI_PROTOCOL_TESTS suites on a sixth: one job building every target took over 30 minutes
    # to reach the 90th of ~230.
    strategy:
      fail-fast: false
      matrix:
        part: ['1', '2', '3', '4', '5', suites]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.part }}

      # Every protocol is in the one library crate. Checking it peaks at ~12 GB of memory (a
      # runner has 16), and every test binary that links it is ~870 MB, so the runner's ~14 GB
      # of free disk runs out partway through linking. A starved runner does not fail, it
      # "loses communication with the server". Swap on /mnt, the runner's second disk, and the
      # preinstalled SDKs nothing here uses (~30 GB) are the room.
      - name: make room (swap and disk)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/netget-swap
          sudo chmod 600 /mnt/netget-swap
          sudo mkswap /mnt/netget-swap
          sudo swapon /mnt/netget-swap
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          free -h
          df -h / /mnt

      # Every third-party binary the CI_FEATURES test binaries drive. Each of these tests
      # deliberately FAILS rather than skips when its binary is absent - a skip-when-missing
      # gate is a silent pass, not evidence - so this job has to carry them. It is NOT enough
      # that `registry-audit` installs the same clients: that job is `continue-on-error`, so a
      # green PR says nothing about it, and this is the only BLOCKING job these tests run in.
      #
      #   dig       bind9-dnsutils  server::dns::dig_test        (ISC BIND)
      #   kdig      knot-dnsutils   server::dns::kdig_test       (Knot - the second resolver)
      #   redis-cli redis-tools     server::redis::real_client_test (the C client, not redis-rs),
      #                             server::redis::{pubsub,cluster}_test (redis-cli SUBSCRIBE,
      #                             -c and --cluster check), and client::redis's real-server tests
      #   redis-server redis-server client::redis::{real_server,pubsub_real_server,
      #                             cluster_real_server}_test (the real server, and a real
      #                             three-node cluster, the redis CLIENT is tested against) and
      #                             server::redis::keys_oracle_test (CLUSTER KEYSLOT and KEYS as
      #                             the oracle for NetGet's hash slots and glob matching)
      #   nginx     nginx           client::http::real_server_test (the real server the http
      #                             CLIENT is tested against)
      #
      # `curl` and `python3`, which server::http::real_client_test drives, are preinstalled on
      # every GitHub runner image and are not listed here.
      #
      # `tests/ci_feature_clients_are_installed` (in tests/real_client_evidence_is_run_test.rs)
      # derives this list from the test sources and fails the build if it drifts - which is how
      # kdig and redis-cli came to be missing here in the first place.
      - name: install the third-party clients the CI_PROTOCOL_TESTS suites drive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bind9-dnsutils knot-dnsutils redis-tools redis-server nginx \
            bind9 bind9-utils ldnsutils
          # Not decoration: these fail the step when a package silently stopped shipping
          # the binary, which is a clearer signal than three test failures later on.
          dig -v
          kdig -V
          # dns is in CI_FEATURES: server::dns::dnssec_test validates with delv and drill and
          # verifies a signed zone with ldns-verify-zone and dnssec-verify, and
          # client::dns::real_server_test runs named unprivileged from a temp dir — which
          # Ubuntu's AppArmor profile for /usr/sbin/named forbids, so it is unloaded, and the
          # packaged service is stopped so it holds no port.
          sudo systemctl stop named || true
          if [ -f /etc/apparmor.d/usr.sbin.named ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.named || true
          fi
          named -v
          delv -v
          command -v drill ldns-verify-zone dnssec-verify
          redis-cli --version
          redis-server --version
          # server::redis::resp3_test's second RESP3 client (redis-py, protocol=3).
          python3 -m pip install --user --break-system-packages 'redis==5.2.*'
          python3 -c "import redis; print('redis-py', redis.__version__)"
          # /usr/sbin, which the real-server helper also searches.
          nginx -v

      # The pcap oracle (tests/helpers/pcap_oracle.rs) runs tshark over the bytes each
      # server emitted, as an independent decoder. It deliberately FAILS rather than
      # skips when tshark is absent, for the same reason dig does above: a
      # skip-when-missing gate is a silent pass. dns, http, redis and tcp are all in
      # CI_FEATURES and all adopt it, so the binary must be here.
      #
      # DEBIAN_FRONTEND and the preseed are not optional: the tshark package asks,
      # interactively, whether non-superusers may capture packets, and an unanswered
      # debconf prompt hangs the job until the 30-minute timeout. The oracle reads
      # files it wrote itself and never captures, so the answer is "no".
      - name: install tshark (required by the pcap oracle)
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" \
            | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
          tshark --version | head -1
          # The oracle needs `resp` specifically; see the runs-on comment above. Assert it
          # here so a runner-image change that quietly takes it away says so in one line
          # rather than as three confusing redis test failures.
          tshark -G protocols | awk -F'\t' '$3=="resp"{found=1} END{
            if (!found) {
              print "this tshark has no `resp` dissector (needs Wireshark >= 4.0)" > "/dev/stderr"
              exit 1
            }
            print "resp dissector present"
          }'

      # Every protocol is in every test binary (~870 MB each, ~230 targets), so the targets
      # are built and run ten at a time with each batch's executables deleted after it; all
      # at once would not fit on the runner.
      #
      # `eval::probe_check::` is skipped for the reason the protocol suites are filtered: each
      # case drives the eval's real third-party client for its protocol (cypher-shell, nak,
      # mosquitto_sub, ...) and none of those protocols is in CI_PROTOCOL_TESTS.
      - name: cargo test (every target but the protocol suites, in batches)
        if: matrix.part != 'suites'
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          TEST_THREADS: '100'
          SHARD: ${{ matrix.part }}/5
        run: |
          scripts/test_batches.sh --locked --no-default-features --features "$CI_FEATURES" \
            -- --skip eval::probe_check::

      - name: cargo test (the CI_PROTOCOL_TESTS suites)
        if: matrix.part == 'suites'
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: |
          cargo test --locked --no-default-features --features "$CI_FEATURES" \
            --test server --test client -- $CI_PROTOCOL_TESTS --test-threads=100

  wasm-web:
    name: Browser build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-web

      - name: install wasm-bindgen at the version Cargo.lock pins
        run: |
          v="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')"
          cargo install wasm-bindgen-cli --version "$v" --locked

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The shim crates' own tests, which **nothing else runs**. `cargo test` at the root
      # builds the root package only, so every test under `crates/*/tests/` is invisible to
      # the blocking `test` job — including the eight covering `TcpStream::peek`, which is
      # what thirty servers' first-byte deadline rests on in the browser build. They run on
      # the host: the virtual network is in-memory duplexes and needs no wasm target.
      - name: cargo test (the wasm shim crates)
        run: cargo test --locked -p netget-tokio-wasm -p netget-crossterm-wasm

      - name: build the bundle
        run: ./web/build.sh

      - name: smoke-test the bundle headlessly
        run: |
          node web/test/smoke.mjs
          node web/test/nntp.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU browser fixture runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Exercise browser interactions without GPUs or real models
        env:
          NETGET_CPU_ONLY: '1'
        run: python web/test/page_composer.py

  resource-lifecycles:
    name: CPU resource and lifecycle regressions
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      NETGET_USE_OLLAMA: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      AUDIT_CPU_FEATURES: mcp-stdio,mcp-http,sqlite,terminal-snapshot
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          key: resource-lifecycles
      - name: Install fixture runtimes and fonts
        run: sudo apt-get update && sudo apt-get install -y python3 perl golang-go fonts-dejavu-core
      - name: Run native regressions without real models
        run: |
          cargo test --locked --no-default-features \
            --features "$AUDIT_CPU_FEATURES" \
            --no-fail-fast \
            --test core_followup_test --test eval_probe_followup_test --test eval_probe_classification_test \
            --test llm_circuit_breaker_test --test llm_rate_limiter_test \
            --test client_credential_logging_test --test secret_redaction_test \
            --test scheduled_task_lifecycle_test --test scheduled_task_claim_test \
            --test sqlite_query_bounds_test --test sqlite_identifier_test \
            --test easy_startup_test --test utils_save_load_test \
            --test startup_cancellation_test --test non_interactive_run_limits_test \
            --test scripting_resources_test --test scripting_resident_test \
            --test static_handler_interpolation_test --test mcp_stop_cleanup_test --test mcp_startup_config_test \
            --test client_followup_test --test client_review_regression_test \
            --test dashboard_frame_test --test display_rendering_test \
            --test test_infrastructure_review_test \
            --test grpc_value_bounds_test --test vendored_tonic_patch_test --test audit_server_decoder_bounds_test \
            --test wrapper_lifecycle_test --test task_registration_cancellation_test \
            --test recursive_decoder_depth_test --test spawned_netget_is_tied_test \
            -- --test-threads=32
      - name: Focused PTY lifecycle regressions with inert fixtures
        run: |
          cargo test --locked --no-default-features --features "$AUDIT_CPU_FEATURES" \
            --test terminal_snapshot child_lifecycle -- --test-threads=32
      - name: Browser parsing and package launcher fixtures
        run: node --test web/test/composer_model_test.mjs web/test/telnet_test.mjs tests/npm_launcher_test.cjs tests/npm_download_test.cjs

  orphaned-tests:
    name: Orphaned test check
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # rustfmt is what resolves the module graph in the file-level check below.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Guards a bug that silently cost this repo most of its test
      # coverage: tests/server.rs and tests/client.rs only compile
      # directories declared with `pub mod <name>;` in the sibling
      # mod.rs. A directory present on disk but undeclared there is
      # never compiled and never run - no error, no warning, just
      # missing coverage (see IMPROVEMENTS.md #5/#6). This job fails
      # the build the moment that happens again.
      - name: Check for orphaned test directories
        shell: bash
        run: |
          set -uo pipefail

          check_group() {
            local label="$1" test_dir="$2" mod_file="$3"

            if [ ! -f "$mod_file" ]; then
              echo "::error::$mod_file not found"
              return 1
            fi

            local declared
            declared=$(grep -oE "pub mod [a-z0-9_]+" "$mod_file" | awk '{print $3}' | sort -u)

            local on_disk
            on_disk=$(ls -d "$test_dir"/*/ 2>/dev/null | sed "s|^$test_dir/||;s|/\$||" | sort -u)

            local orphans
            orphans=$(comm -23 <(echo "$on_disk") <(echo "$declared"))

            if [ -n "$orphans" ]; then
              echo "::error::Orphaned $label test director$(if [ "$(echo "$orphans" | wc -l)" = "1" ]; then echo y; else echo ies; fi) - present on disk under $test_dir/ but NOT declared in $mod_file, so cargo never compiles or runs them:"
              echo "$orphans" | sed 's/^/    /'
              echo
              echo "Fix: add a feature-gated 'pub mod <name>;' line to $mod_file for each directory above, e.g.:"
              echo '    #[cfg(feature = "<name>")]'
              echo '    pub mod <name>;'
              echo "If the directory is a leftover/stub with no real tests, delete it instead."
              return 1
            fi

            echo "OK: every directory under $test_dir/ is declared in $mod_file."
            return 0
          }

          status=0
          check_group server tests/server tests/server/mod.rs || status=1
          check_group client tests/client tests/client/mod.rs || status=1

          exit $status

      # The directory check above is necessary and not sufficient. It compares
      # directories, so it cannot see:
      #   * a FILE inside a declared directory that the directory's own mod.rs omits -
      #     tests/server/{proxy,ssh_agent,datalink}/mod.rs each declared only
      #     `mod e2e_test;`, hiding the 704-line, 8-test proxy suite that is the only one
      #     routing real traffic through the proxy;
      #   * a test tree outside tests/server and tests/client - tests/e2e/ and
      #     tests/validators/ were reachable from no target root at all;
      #   * anything under src/ - six dead modules there had never been compiled.
      # 29 test functions and 20 files were invisible this way. The script resolves the
      # real module graph (via rustfmt) and fails on anything unreachable that is not
      # explicitly declared dead in .github/unreachable-modules.txt. It also runs rustfmt
      # over every tracked .rs file, which closes the same hole for formatting: `cargo fmt`
      # has no feature flags and does not evaluate cfg, so undeclared modules - not
      # cfg-gated ones - are the only files it never sees.
      - name: Check every .rs file is reachable from a target root
        run: ./.github/scripts/check-module-reachability.sh

  windows-resource-checks:
    name: Windows CPU resource and configuration checks
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-resource-checks
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # These targets use local fixtures only. Native Job Object tests exercise
      # descendant termination on normal drop and abrupt owner termination.
      - name: Native Windows configuration and concurrency regressions
        run: >-
          cargo test --locked --no-default-features
          --test core_followup_test --test llm_rate_limiter_test --test llm_config_test
          --test process_group_windows_test
      - name: Native Windows package launcher and archive fixtures
        run: node --test tests/npm_launcher_test.cjs tests/npm_download_test.cjs
