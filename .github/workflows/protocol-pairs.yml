    if: (inputs.suite != 'p2p-news') && (inputs.only == '' || inputs.only == 'gre')
    name: GRE (IP protocol 47) server and client against the Linux kernel's ip_gre (gre and gretap) and scapy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: protocol-pairs-${{ github.job }}
      - name: Install iproute2, ethtool, ping, arping, nc, scapy and tshark
        run: |
          set -euo pipefail
          echo 'wireshark-common wireshark-common/install-setuid boolean false' | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            iproute2 ethtool iputils-ping iputils-arping netcat-openbsd python3-scapy tshark
          dpkg-query -W iproute2 iputils-arping netcat-openbsd python3-scapy tshark
          # NetGet opens a raw IP protocol-47 socket in the test process, and the kernel peer
          # lives in a network namespace: both need root.
          sudo -n true
          # ip_gre for the kernel's gre and gretap links. Ubuntu ships some tunnel modules only
          # in linux-modules-extra, and the runner's kernel can be ahead of the archive, so that
          # package is installed only when modprobe cannot find the module.
          if ! sudo modprobe ip_gre; then
