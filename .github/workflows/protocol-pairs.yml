          # Only reach for linux-modules-extra when the base modules lack iscsi_tcp: a freshly
          # booted runner kernel can be ahead of the archive, and then that package does not exist.
          if ! sudo modprobe iscsi_tcp; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              "linux-modules-extra-$(uname -r)"
            sudo modprobe iscsi_tcp
