  ngap:
    if: (inputs.suite != 'p2p-news') && (inputs.only == '' || inputs.only == 'ngap')
    name: NGAP AMF and gNB against UERANSIM and an Open5GS core over SCTP
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: protocol-pairs-${{ github.job }}
      - name: Load the kernel's SCTP module
        run: |
          set -euo pipefail
          # modprobe first: the runner's kernel can be ahead of the archive, so a
          # linux-modules-extra for it may not exist. Install it only when sctp is missing.
          if ! sudo modprobe sctp; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
            sudo modprobe sctp
          fi
          test -d /proc/sys/net/sctp
      - name: Cache UERANSIM v3.2.7
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ngap
          key: ngap-ueransim-${{ runner.os }}-${{ hashFiles('tests/server/ngap/install_peers.py') }}
      - name: Build UERANSIM, install an Open5GS core and MongoDB, grant the capabilities the peers need
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          echo 'wireshark-common wireshark-common/install-setuid boolean false' | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            cmake g++ libsctp-dev lksctp-tools tshark iputils-ping software-properties-common gnupg curl
          sudo add-apt-repository -y ppa:open5gs/latest
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            open5gs-amf open5gs-smf open5gs-upf open5gs-nrf open5gs-scp open5gs-ausf open5gs-udm \
            open5gs-udr open5gs-pcf open5gs-nssf open5gs-bsf mongodb-org-server mongodb-mongosh
          # The packages start their own core on 127.0.0.x; the tests start theirs on 127.0.20.x
          # (the full core) and probed ports (the AMF alone).
          sudo systemctl stop 'open5gs-*' mongod || true
          sudo setcap cap_net_raw,cap_net_admin=eip "$(command -v dumpcap)"
          python3 tests/server/ngap/install_peers.py "$RUNNER_TEMP/ngap" | sed 's/^export //' >> "$GITHUB_ENV"
          # Open5GS's UPF creates its TUN and checks nothing but the kernel's verdict, so
          # CAP_NET_ADMIN on the binary is enough for the unprivileged test. nr-ue is different:
          # UERANSIM refuses to build uesimtun* unless geteuid() is 0, whatever its
          # capabilities, so the test runs it through `sudo -n` (passwordless on this runner).
          sudo setcap cap_net_admin+ep "$(readlink -f "$(command -v open5gs-upfd)")"
          getcap "$(readlink -f "$(command -v open5gs-upfd)")"
          sudo -n true
      - name: Both roles with mandatory independent peers, bounds and fail-closed paths
        run: |
