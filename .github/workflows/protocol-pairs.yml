      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Install open-iscsi, tgt and tshark; build libiscsi 1.20.3; install gotgt; no daemon may hold port 3260
        run: |
          set -euo pipefail
          echo 'wireshark-common wireshark-common/install-setuid boolean false' | sudo debconf-set-selections
          sudo apt-get update
          # The packages' own services would hold port 3260; the tests start their own.
          echo exit 101 | sudo tee /usr/sbin/policy-rc.d >/dev/null
