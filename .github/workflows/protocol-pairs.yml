          sh scripts/test-peers/build-libiscsi.sh "$RUNNER_TEMP/libiscsi" | tail -1 >> "$GITHUB_PATH"
          GOBIN="$RUNNER_TEMP/gotgt" go install github.com/gostor/gotgt@v0.2.2
          echo "NETGET_GOTGT=$RUNNER_TEMP/gotgt/gotgt" >> "$GITHUB_ENV"
          dpkg-query -W open-iscsi tgt tshark
