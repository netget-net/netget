  fuse:
    if: (inputs.suite != 'p2p-news') && (inputs.only == '' || inputs.only == 'fuse')
    name: FUSE local filesystem against the Linux kernel's FUSE driver, coreutils, Python and pjdfstest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: protocol-pairs-${{ github.job }}
      - name: Cache the pjdfstest build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pjdfstest-peer
          key: pjdfstest-85a8aea-${{ runner.os }}-${{ runner.arch }}
      - name: Install fuse3 and pjdfstest; load fuse
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            fuse3 build-essential autoconf automake perl python3 openssl
          # fuse is in the base modules. Only reach for linux-modules-extra when modprobe
          # fails: a freshly booted runner kernel can be ahead of the archive, and then that
          # package does not exist.
          if [ ! -c /dev/fuse ]; then
            if ! sudo modprobe fuse; then
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                "linux-modules-extra-$(uname -r)" || true
              if ! sudo modprobe fuse; then
                echo "::error::kernel $(uname -r) cannot load fuse; the kernel peer this job exists for cannot run"
                exit 1
              fi
            fi
          fi
          test -c /dev/fuse
          # The runner user mounts through the setuid helper; root needs nothing more.
          if [ ! -w /dev/fuse ]; then sudo chmod 666 /dev/fuse; fi
          ls -l /dev/fuse "$(command -v fusermount3)"
          fusermount3 --version
          dpkg-query -W fuse3
          suite=$(sh scripts/test-peers/build-pjdfstest.sh "$RUNNER_TEMP/pjdfstest-peer" | tail -1)
          echo "NETGET_PJDFSTEST=$suite" >> "$GITHUB_ENV"
          # pjdfstest switches users and needs root.
          sudo -n true
      - name: Tools, bounds and fail-closed paths unprivileged, then everything and pjdfstest as root
        run: |
          set -euo pipefail
          command -v fusermount3 prove python3
          test -x "$NETGET_PJDFSTEST/pjdfstest"
          for filter in \
            fuse::; do
            # As the runner user: mounts go through the setuid fusermount3, the path an
            # operator without root takes. pjdfstest is the one test that needs root.
            user_log="$RUNNER_TEMP/${GITHUB_JOB}-user.log"
            cargo test --locked --no-default-features \
              --test server -- "$filter" --skip pjdfstest --test-threads=4 2>&1 | tee "$user_log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$user_log"
            # As root (cargo builds as the runner user and runs the test binary through sudo).
            root_log="$RUNNER_TEMP/${GITHUB_JOB}-root.log"
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="sudo -E env PATH=$PATH" \
              cargo test --locked --no-default-features \
              --test server -- "$filter" --test-threads=4 --nocapture 2>&1 | tee "$root_log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$root_log"
            grep -E '^pjdfstest: ' "$root_log"
          done
      - name: Shared declarations, native startup, privacy and ownership
        run: |
          cargo test --locked --no-default-features \
            --test event_action_declarations_test \
            --test advertised_actions_test \
            --test action_descriptions_test \
            --test startup_examples_validation_test \
            --test examples \
            --test startup_param_defaults_test \
            --test startup_param_drift_test \
            --test protocol_startup_examples_test \
            --test startup_params_result_test \
            --test startup_constructed_input_test \
            --test management_test \
            --test management_form_test \
            --test dual_protocol_test \
            --test dashboard_wireshark_test \
            --test event_emit_sites_test \
            --test task_registration_cancellation_test \
            --test server_task_registry_test \
            --test peer_handle_coverage_ratchet_test \
            --test secret_redaction_test \
            --test wire_failure_test \
            --test site_protocol_list_test \
            --test well_known_port_declaration_test \
            --test failure_mode_declaration_test \
            --test decision_tag_ratchet_test \
            --test max_inbound_bytes_declaration_test \
            --test test_suite_hygiene_test \
            --test real_client_evidence_is_run_test \
            --test startup_privilege_transport_test \
