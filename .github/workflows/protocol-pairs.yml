            bind9 bind9-utils bind9-dnsutils knot-dnsutils ldnsutils tshark
          sudo systemctl stop named || true
          if [ -f /etc/apparmor.d/usr.sbin.named ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.named || true
          fi
          for tool in named dig delv kdig drill ldns-verify-zone dnssec-verify tshark; do
