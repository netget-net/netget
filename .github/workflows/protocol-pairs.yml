  bfd:
    if: (inputs.suite != 'p2p-news') && (inputs.only == '' || inputs.only == 'bfd')
    name: BFD server and client against BIRD
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: protocol-pairs-${{ github.job }}
      - name: Install BIRD 2 and tshark
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bird2 tshark
          # The package starts a system BIRD; the tests run their own from a temp dir.
          sudo systemctl stop bird || true
          # BIRD's BFD sockets ask for SO_PRIORITY 7, which needs CAP_NET_ADMIN. Run unprivileged
          # without it, every BFD socket fails ("SO_PRIORITY: Operation not permitted") and no
          # session ever leaves Down. The capability on the binary is all it needs; the tests
          # still run BIRD as the runner user from a temp dir.
          sudo setcap cap_net_admin+ep "$(command -v bird)"
          getcap "$(command -v bird)"
          bird --version
          tshark --version | head -1
      - name: Both roles with mandatory independent peers, bounds and fail-closed paths
        run: |
          set -euo pipefail
          for filter in \
            bfd:: \
            client/bfd::; do
            case "$filter" in
              client/*) target=client; filter=${filter#client/} ;;
              *) target=server ;;
            esac
            pair_log="$RUNNER_TEMP/${GITHUB_JOB}-${target}-${filter//:/_}.log"
