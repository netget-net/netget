  coap-observe-blockwise:
    if: (inputs.suite != 'p2p-news') && (inputs.only == '' || inputs.only == 'coap-observe-blockwise')
    name: CoAP Observe and Block-wise with libcoap and aiocoap
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: protocol-pairs-${{ github.job }}
      # libcoap 4.3.5 rather than noble's packaged libcoap3-bin, so this job drives the same
      # coap-client and coap-server the registry-audit job builds. Without DTLS, into
      # /usr/local; a TLS-suffixed binary name is linked to the plain one.
      - name: Build libcoap 4.3.5
        run: |
          git clone --quiet --depth 1 --branch v4.3.5 https://github.com/obgm/libcoap.git /tmp/libcoap
          cmake -S /tmp/libcoap -B /tmp/libcoap/build -DENABLE_DTLS=OFF -DENABLE_DOCS=OFF \
            -DENABLE_EXAMPLES=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/libcoap/build -j"$(nproc)"
          sudo cmake --install /tmp/libcoap/build
          sudo ldconfig
          for tool in coap-server coap-client; do
            if [ ! -x "/usr/local/bin/$tool" ]; then
              suffixed=$(ls /usr/local/bin/"$tool"-* 2>/dev/null | head -1)
              [ -n "$suffixed" ] && sudo ln -sf "$suffixed" "/usr/local/bin/$tool"
            fi
            [ "$(command -v $tool)" = "/usr/local/bin/$tool" ] || { echo "$tool is not the 4.3.5 build" >&2; exit 1; }
          done
