  dns-transfer-dnssec:
    if: inputs.suite != 'p2p-news'
    name: DNS TCP, zone transfers and DNSSEC with BIND, Knot and ldns
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PAIR_FEATURES: dns
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: protocol-pairs-${{ github.job }}
      # dig, delv and named (BIND), kdig (Knot), drill and ldns-verify-zone (ldns),
      # dnssec-verify (bind9-utils), tshark for the pcap oracle. Ubuntu's AppArmor profile
      # confines named to its packaged paths, and the client test runs it from a temp dir.
      - name: Install BIND, Knot, ldns and tshark
        run: |
          sudo apt-get update -q
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
