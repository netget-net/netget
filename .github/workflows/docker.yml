name: Docker

# Builds the repository's Dockerfile for linux/amd64 and linux/arm64 and publishes one
# multi-arch image to ghcr.io/netget-net/netget.
#
# A tag push (v*) publishes `X.Y.Z` and `latest`; workflow_dispatch publishes the tag given in
# its `tag` input (default `latest`) from whatever ref it is dispatched against. Pushes to
# master start nothing, like every other workflow here.
#
# Each architecture builds on a native runner and is pushed by digest; the merge job then
# writes one manifest list over both digests under every requested tag. That is Docker's
# documented multi-platform pattern without emulation: a NetGet release build compiles every
# protocol, and under QEMU it would not finish inside a job's time limit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (e.g. latest, 0.3.9, edge)
        type: string
        default: latest

permissions:
  contents: read
  packages: write

# One publish per ref at a time; a second dispatch waits rather than racing the first to the
# same tag.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/netget-net/netget

jobs:
  prepare:
    name: Resolve tags and labels
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      smoke_tag: ${{ steps.meta.outputs.smoke_tag }}
      version: ${{ steps.meta.outputs.version }}
      description: ${{ steps.meta.outputs.description }}
      licenses: ${{ steps.meta.outputs.licenses }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags and OCI metadata
        id: meta
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The first `key = "..."` in Cargo.toml is the [package] table's.
          field() { grep -m1 "^$1 *= *\"" Cargo.toml | sed -E 's/^[^"]*"(.*)"$/\1/'; }
          version=$(field version)
          description=$(field description)
          licenses=$(field license)
          if [ -z "$version" ] || [ -z "$description" ] || [ -z "$licenses" ]; then
            echo "Could not read version/description/license from Cargo.toml" >&2
            exit 1
          fi

          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            tag_version="${REF_NAME#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "Tag $REF_NAME does not match Cargo.toml version $version" >&2
              exit 1
            fi
            tags="$tag_version latest"
            smoke_tag="$tag_version"
          else
            tag="${INPUT_TAG:-latest}"
            # Docker's tag grammar: [A-Za-z0-9_][A-Za-z0-9_.-]{0,127}
            if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "'$tag' is not a valid image tag" >&2
              exit 1
            fi
            tags="$tag"
            smoke_tag="$tag"
          fi

          {
            echo "tags=$tags"
            echo "smoke_tag=$smoke_tag"
            echo "version=$version"
            echo "description=$description"
            echo "licenses=$licenses"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $IMAGE as: $tags (Cargo.toml version $version)"

  build:
    name: build (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm # native arm64 runner, as in release.yml; never QEMU
    steps:
      - uses: actions/checkout@v4

      # The same room the heavy CI and release jobs make: the release build of the monolithic
      # crate needs more than the runner's 16 GB of memory, and a starved runner does not fail,
      # it "loses communication with the server". BuildKit's containers share the host's
      # memory, so swap on the host covers the build inside them.
      - name: Make room for release compilation (swap and disk)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/netget-swap
          sudo chmod 600 /mnt/netget-swap
          sudo mkswap /mnt/netget-swap
          sudo swapon /mnt/netget-swap
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          free -h
          df -h / /mnt

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only: no tag points at a single-architecture image. The merge job
      # tags the manifest list. The GHA cache is scoped per architecture so the two builds do
      # not evict each other; mode=max keeps the builder stage's layers too. The cargo target
      # directory is a BuildKit cache mount, which is not exported to the GHA cache, so a
      # source change still compiles from scratch — the cache saves the unchanged-commit
      # rebuild (a dispatch followed by the tag at the same commit) and the apt layers.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=netget
            org.opencontainers.image.description=${{ needs.prepare.outputs.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=https://netget.net
            org.opencontainers.image.licenses=${{ needs.prepare.outputs.licenses }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The index annotations are what ghcr.io shows on the package page for a manifest list;
      # the image labels above are what `docker inspect` shows for one platform.
      - name: Create manifest list and push tags
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          DESCRIPTION: ${{ needs.prepare.outputs.description }}
          LICENSES: ${{ needs.prepare.outputs.licenses }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          count=$(find . -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "Expected 2 digests (amd64, arm64), found $count" >&2
            ls -la
            exit 1
          fi
          args=()
          for t in $TAGS; do args+=(-t "$IMAGE:$t"); done
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create \
            "${args[@]}" \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.licenses=$LICENSES" \
            "${sources[@]}"

      - name: Inspect the manifest list
        env:
          TAG: ${{ needs.prepare.outputs.smoke_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$TAG"
          platforms=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | sort | join(",")')
          echo "Platforms: $platforms"
          if [ "$platforms" != "linux/amd64,linux/arm64" ]; then
            echo "Expected linux/amd64,linux/arm64 in $IMAGE:$TAG, found '$platforms'" >&2
            exit 1
          fi

      # Pulls the published image on this amd64 runner, so it exercises what a user gets from
      # `docker pull`, not the build's local copy.
      - name: Smoke test (amd64)
        env:
          TAG: ${{ needs.prepare.outputs.smoke_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          out=$(docker run --rm --platform linux/amd64 "$IMAGE:$TAG" --version)
          echo "$out"
          case "$out" in
            *"$VERSION"*) ;;
            *) echo "Expected version $VERSION in '$out'" >&2; exit 1 ;;
          esac
