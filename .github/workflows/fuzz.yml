name: Fuzz

# On-demand fuzzing of the pre-authentication decoders. See fuzz/README.md.
#
# This is deliberately NOT a PR gate and must never become one. A fuzzer is a search,
# not a check: it finds a defect on the run it happens to find it on, so gating a merge
# on "did the search turn something up in 300 seconds" fails honest PRs at random and
# passes the ones that got lucky. `ci.yml` is the gate; this job's output is a crash
# artefact, and a crash here is a real defect whenever it appears, on whatever branch.
#
# What it *can* regress on is the harness itself — a target that stops compiling, or a
# corpus that stops being readable — and the build step below fails loudly for that.
#
# **But only when someone dispatches it, and that is not a check.** This workflow is
# `workflow_dispatch` only, so between dispatches nothing built these targets at all:
# `coap_message.rs` stopped compiling hours after it was written, when `CoapMessage::encode`
# became fallible, and it stayed broken for weeks while the Stable bar's "a fuzz target exists
# and has run clean" was being satisfied by a target that could not build. The fallback this
# comment used to offer — run the same search locally — is a fallback nobody runs.
#
# `ci.yml`'s `ratchets` job now does `cargo check --manifest-path fuzz/Cargo.toml --all-targets`
# on every PR. That is stable-only and about two minutes, because compiling the targets against
# the current library API is the drift that actually happens; linking libFuzzer is what needs
# nightly, and `cargo check` does not link. The search stays on-demand, as it should.
on:
  workflow_dispatch:
    inputs:
      seconds_per_target:
        description: 'Seconds to run each target'
        required: false
        default: '300'

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Per-target budget. Each matrix job gets its own budget; a dispatch can ask for more.
  SECONDS_PER_TARGET: ${{ github.event.inputs.seconds_per_target || '300' }}

jobs:
  # One build, many runs. Every target links the netget library, and compiling that library
  # peaks at ~12 GB, so a job per target meant ~45 full compiles of ~70 minutes each on runners
  # that, without swap, are shut down mid-compile rather than failing ("The runner has received
  # a shutdown signal", exit 143). On 23 October 2026 every one of 45 jobs died that way and no
  # target was fuzzed at all. The build job compiles every target once with the room ci.yml's
  # heavy jobs make for themselves; each matrix job then fuzzes a prebuilt binary.
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: make room (swap and disk)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/netget-swap
          sudo chmod 600 /mnt/netget-swap
          sudo mkswap /mnt/netget-swap
          sudo swapon /mnt/netget-swap
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          free -h
          df -h / /mnt

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      # The fuzz crate turns on `lldp`/`cdp` (libpcap) and `nfc`/`nfc-client` (pcsclite); keep
      # this list in step with ci.yml's ratchets job, which `cargo check`s the same crate.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcap-dev libpcsclite-dev

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build every target
        working-directory: fuzz
        run: |
          cp ../Cargo.lock Cargo.lock
          # cargo fuzz defaults to one codegen unit outside --dev, which hands LLVM the whole
          # library, every protocol, as a single module with ASan on: that alone outgrew 15 GB
          # of memory and 15 GB of swap and the runner was shut down. Sixteen units bound each
          # module; two jobs keep only a couple of them in memory at once.
          CARGO_BUILD_JOBS=2 cargo fuzz build --codegen-units 16
          mkdir -p ../fuzz-bin
          for target in $(cargo fuzz list); do
            cp "target/x86_64-unknown-linux-gnu/release/$target" ../fuzz-bin/
          done
          ls -l ../fuzz-bin
          du -sh ../fuzz-bin

      - uses: actions/upload-artifact@v4
        with:
          name: fuzz-binaries
          path: fuzz-bin/
          if-no-files-found: error
          retention-days: 1

  fuzz:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - bencode_structure
          - snmp_ber
          - amqp_field_table
          - nats_frame
          - stomp_frame
          - radius_packet
          - dns_message
          - lldp_frame
          - cdp_frame
          - modbus_adu
          - coap_message
          - hsrp_message
          - m3ua_message
          - h323_per
          - openflow_message
          - profinet_frame
          - ethercat_frame
          - mbus_frame
          - afp_dsi
          - nis_yp
          - rsh_handshake
          - lorawan_semtech
          - iscsi_pdu
          - nvme_tcp_pdu
          - fuse_tree_description
          - hdfs_wire
          - zigbee_ash_ezsp
          - ngap_nas
          - onvif_request
          - bgp_message
          - ndef_message
          - nfc_apdu
          - nfs_record_guard
          - resp_frame
          - bson_document
          - ldap_filter
          - svn_tuple
          - xmlrpc_value
          - packstream_message
          - nsq_frame
          - smb2_request
          - ntlmssp_token
          - zabbix_packet
          - gearman_packet
          - nostr_message
          - stratum_v2_message
    env:
      TARGET: ${{ matrix.target }}
      # cargo fuzz run sets this; running the binary directly has to as well.
      ASAN_OPTIONS: detect_odr_violation=0
    steps:
      - uses: actions/checkout@v4

      # The binaries link these dynamically.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap0.8 libpcsclite1

      - uses: actions/download-artifact@v4
        with:
          name: fuzz-binaries
          path: fuzz-bin

      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: |
          if [[ ! "$SECONDS_PER_TARGET" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::seconds_per_target must be a positive integer"
            exit 1
          fi
          chmod +x "../fuzz-bin/$TARGET"
          mkdir -p "corpus/$TARGET" "artifacts/$TARGET"
          "../fuzz-bin/$TARGET" "corpus/$TARGET" \
            "-artifact_prefix=artifacts/$TARGET/" \
            "-max_total_time=$SECONDS_PER_TARGET" \
            -timeout=25 \
            -rss_limit_mb=2048 \
            -print_final_stats=1

      - name: Upload crash artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload grown corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 7
