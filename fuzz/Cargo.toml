[package]
name = "netget-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-or-later"

# This is its own workspace root. It is deliberately NOT a member of the netget
# workspace: `cargo build`, `cargo test` and `cargo check` at the repository root
# must never see this package, because it needs a nightly toolchain and links
# libFuzzer's sanitizer runtime. The root `Cargo.toml` names it under
# `[workspace] exclude` for the same reason.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# Decoders that a NetGet guard stands in front of. A target that only checks "the guard
# does not panic" proves the easy half; the half that killed the process is whether the
# guard's *accept* verdict is one the decoder behind it survives. So where a guard exists
# to protect a third-party decoder, the target hands accepted input to that decoder.
serde_bencode = "0.2"
# Behind `utils::resp`: the Redis server's RESP2 decoder. Same major version as netget's.
redis-protocol = "6.0"
# Behind `utils::bson_depth`: the MongoDB server's command-document decoder.
bson = "3.0"
# Behind `utils::cbor_depth`: the usb-fido2 server's CTAP2 parameter decoder. Same version as
# netget's; `serde` for `Value::deserialize` on a `Deserializer` whose offset the target reads.
serde_cbor = "0.11"
serde = "1"

# NetGet has no DNS parser of its own — `dns`, `dot` and `doh` all call
# `Message::from_vec` inline. See fuzz_targets/dns_message.rs.
hickory-proto = "0.24"

# The Nostr target checks that every refusal NetGet renders is itself JSON.
serde_json = "1"

# The MySQL target runs opensrv-mysql's own protocol loop behind NetGet's PacketLimitReader,
# with a shim of its own: see fuzz_targets/mysql_session.rs.
opensrv-mysql = "0.7"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "io-util"] }

# The HDFS target decodes Hadoop's protocol buffers with the same prost as netget's.
prost = "0.13"

# The ONVIF target hands the device's clock to the termination-time parser, as the server does.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# The gRPC target builds its schema and decodes with the same prost-reflect the server uses.
prost-reflect = "0.14"
prost-types = "0.13"

# The PostgreSQL target drives pgwire's frontend decoder directly — the patched copy, through
# the [patch.crates-io] below.
pgwire = "0.35"
bytes = "1"

# The WebSocket target runs the server's DeflateStream under tokio-tungstenite, as the server
# does, polling it with a no-op waker over an in-memory socket (tokio's I/O traits, from the
# `tokio` entry above).
tokio-tungstenite = "0.21"
futures-util = "0.3"

# This crate is its own workspace, so the root manifest's [patch.crates-io] does not reach it
# and without these lines the netget it builds links crates.io's pgwire — the one that panics
# on six malformed bytes (vendor/pgwire/README.md) — and the pgwire_frontend target would be
# searching a decoder the server does not run. Both entries mirror the root manifest.
[patch.crates-io]
hyper = { path = "../vendor/hyper" }
pgwire = { path = "../vendor/pgwire" }

[dependencies.netget]
package = "netget-tool"
path = ".."
default-features = false
# Protocols are not features, so every decoder is compiled. The two system-library features
# are for the cdp/lldp (libpcap) and nfc-client (PC/SC) decoders.
features = ["libpcap", "pcsc"]

# NOT here, and it is not an oversight: `libusb`, which every USB protocol needs.
#
# `libusb` -> `usbip` -> `nusb`. nusb 0.2.7 — the newest published
# version — carries a `#[cfg(fuzzing)]` helper whose signature does not typecheck:
#
#   pub fn fuzz_parse_concatenated_config_descriptors(buf: &[u8]) -> impl Iterator<Item = &[u8]>
#
# returning `parse_concatenated_config_descriptors(buf)`, which yields
# `ConfigurationDescriptor<'_>`, not `&[u8]` (E0271). cargo-fuzz sets `--cfg fuzzing` for
# the whole graph, so that dead-on-arrival function is compiled and the build fails before
# any NetGet code is reached.
#
# The effect is worth stating plainly: **no code behind `libusb` can be fuzzed at all** until
# nusb fixes this upstream or NetGet stops resolving it through usbip. The CTAPHID
# reassembler is what this still costs. CTAP2's CBOR decode is not behind it: its depth and
# size guard and the decode itself are `utils::cbor_depth::decode_bounded`, which
# `Ctap2Request::parse` calls and the `ctap2_cbor` target drives.

# ---------------------------------------------------------------------------
# Targets. Each one names the decoder it drives; see the module doc in each file
# for why that decoder is worth the CPU.
# ---------------------------------------------------------------------------

[[bin]]
name = "bencode_structure"
path = "fuzz_targets/bencode_structure.rs"
test = false
doc = false
bench = false

