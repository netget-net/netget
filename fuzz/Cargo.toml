[package]
name = "netget-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-or-later"

# This is its own workspace root. It is deliberately NOT a member of the netget
# workspace: `cargo build`, `cargo test` and `cargo check` at the repository root
# must never see this package, because it needs a nightly toolchain and links
# libFuzzer's sanitizer runtime. The root `Cargo.toml` names it under
# `[workspace] exclude` for the same reason.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# Decoders that a NetGet guard stands in front of. A target that only checks "the guard
# does not panic" proves the easy half; the half that killed the process is whether the
# guard's *accept* verdict is one the decoder behind it survives. So where a guard exists
# to protect a third-party decoder, the target hands accepted input to that decoder.
serde_bencode = "0.2"
# Behind `utils::resp`: the Redis server's RESP2 decoder. Same major version as netget's.
redis-protocol = "6.0"
# Behind `utils::bson_depth`: the MongoDB server's command-document decoder.
bson = "3.0"

# NetGet has no DNS parser of its own — `dns`, `dot` and `doh` all call
# `Message::from_vec` inline. See fuzz_targets/dns_message.rs.
hickory-proto = "0.24"

# The Nostr target checks that every refusal NetGet renders is itself JSON.
serde_json = "1"

[dependencies.netget]
package = "netget-tool"
path = ".."
default-features = false
# Protocols are not features, so every decoder is compiled. The two system-library features
# are for the cdp/lldp (libpcap) and nfc-client (PC/SC) decoders.
features = ["libpcap", "pcsc"]

# NOT here, and it is not an oversight: `usb-fido2` (and every other USB feature).
#
# `usb-fido2` -> `usb-common` -> `usbip` -> `nusb`. nusb 0.2.7 — the newest published
# version — carries a `#[cfg(fuzzing)]` helper whose signature does not typecheck:
#
#   pub fn fuzz_parse_concatenated_config_descriptors(buf: &[u8]) -> impl Iterator<Item = &[u8]>
#
# returning `parse_concatenated_config_descriptors(buf)`, which yields
# `ConfigurationDescriptor<'_>`, not `&[u8]` (E0271). cargo-fuzz sets `--cfg fuzzing` for
# the whole graph, so that dead-on-arrival function is compiled and the build fails before
# any NetGet code is reached.
#
# The effect is worth stating plainly: **no NetGet USB protocol can be fuzzed at all** until
# nusb fixes this upstream or NetGet stops resolving it through usbip. The CTAPHID
# reassembler and CTAP2's unguarded `serde_cbor::from_slice` are the two targets this costs,
# and the second is the one worth coming back for — it is the unbounded-recursion class that
# `utils::bencode` and `snmp`'s BER guard both exist for, in a protocol that has no guard.

# ---------------------------------------------------------------------------
# Targets. Each one names the decoder it drives; see the module doc in each file
# for why that decoder is worth the CPU.
# ---------------------------------------------------------------------------

[[bin]]
name = "bencode_structure"
path = "fuzz_targets/bencode_structure.rs"
test = false
doc = false
bench = false

