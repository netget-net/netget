<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetGet | Interactive protocol demo</title>
    <meta name="description" content="Explore the NetGet dashboard with a Telnet client and a simulated network in your browser.">
    <meta property="og:title" content="NetGet | Interactive protocol demo">
    <meta property="og:description" content="Explore the NetGet dashboard with a Telnet client and a simulated network in your browser.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://netget.net/demo.html">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>try { var t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
    <link rel="stylesheet" href="css/demo.css">
    <noscript><style>.demo { display: none; }</style></noscript>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <nav class="nav" aria-label="Main navigation">
        <a class="logo" href="./" aria-label="NetGet home"><svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true"><rect class="lm-top" x="4" y="5" width="56" height="13" rx="4"/><rect class="lm-layer" x="4" y="22" width="56" height="13" rx="4"/><rect class="lm-layer" x="4" y="39" width="56" height="13" rx="4" opacity=".65"/><rect class="lm-layer" x="4" y="55" width="56" height="5" rx="2.5" opacity=".35"/></svg><span class="logo-word">net<span>get</span></span></a>
        <div class="nav-right">
            <a class="nav-link" href="https://github.com/netget-net/netget">GitHub ↗</a>
            <a class="button button-small" href="demo.html" aria-current="page">Demo</a>
            <button class="theme-btn" hidden id="theme-toggle" aria-label="Toggle color theme">◐</button>
        </div>
    </nav>
    <main id="main" class="demo-main">
        <header class="demo-intro">
            <h1>Demo</h1>
            <p>NetGet compiled to WASM for demonstration only</p>
        </header>
        <noscript>
            <section class="demo-preview" aria-label="Static demo preview">
                <picture>
                    <source media="(max-width: 900px)" srcset="demo/preview-mobile.png">
                    <img src="demo/preview.png" alt="NetGet demo showing a Telnet conversation, a manual response composer, and the protocol dashboard.">
                </picture>
                <p class="caption">Static preview. Enable JavaScript to use the interactive demo.</p>
            </section>
        </noscript>
    <section class="demo" id="demo">
        <div class="demo-banner" id="demo-banner" role="alert" hidden></div>

        <div class="demo-grid">
            <!-- The Telnet client -->
            <div class="machine machine-client" id="machine-telnet">
                <div class="machine-label"><span class="machine-dot"></span> Telnet <span class="machine-note">Mock Telnet client connected to NetGet</span><span class="spacer"></span><span class="conn-badge" id="telnet-state">not connected</span></div>
                <div class="screen screen-client"><div class="term-host"><div id="telnet-term"></div></div></div>
            </div>

            <!-- The model: beside the Telnet client on a wide screen -->
            <div class="machine machine-model">
                <div class="machine-label">
                    <span class="machine-dot"></span> LLM <span class="machine-note">Source LLM used by NetGet</span>
                </div>
                <div class="llm-source" id="llm-source">
                    <div class="llm-select-row">
                        <select id="model-select" aria-label="LLM source"><option>Detecting local models…</option></select>
                        <button class="btn btn-primary" id="llm-load" hidden>Download</button>
                    </div>
                    <div class="llm-progress" id="llm-progress" hidden><span id="llm-progress-bar"></span></div>
                    <div class="llm-status" id="llm-status"></div>
                </div>
                <div class="screen screen-model" id="llm-current">
                    <div class="llm-idle">Send a Telnet message to begin.</div>
                </div>
            </div>

            <!-- Both cables run down to NetGet (on a narrow screen: Telnet, NetGet, the model) -->
            <div class="cable cable-client"><span class="cable-line"></span><span class="cable-tag">request</span></div>

            <div class="cable cable-model"><span class="cable-line"></span><span class="cable-tag">prompt</span></div>

            <!-- NetGet, under both -->
            <div class="machine machine-netget">
                <div class="machine-label"><span class="machine-dot"></span> netget <span class="machine-note">NetGet in your browser via WASM</span></div>
                <div class="screen"><div class="term-host"><div id="dash-term"></div></div></div>

            </div>
        </div>
    </section>

    </main>
    <footer class="footer">
        <a href="https://github.com/netget-net/netget">GitHub</a>
        <span class="sep">/</span>
        <a href="https://github.com/netget-net/netget/blob/master/LICENSE">AGPL-3.0</a>
    </footer>
    <script src="js/main.js"></script>
    <!-- Subresource integrity: the hash of the pinned, immutable file as jsdelivr serves it
         (sha384 of https://cdn.jsdelivr.net/npm/<package>@<version>/lib/<file>). A CDN
         compromise or an interception on the way then fails the load instead of running
         someone else's script on netget.net. Bumping a version means recomputing:
           curl -sSL <url> | openssl dgst -sha384 -binary | base64 -w0 -->
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"
            integrity="sha384-M169f14mRZOXm3hD/v2Ti0ThIT/RnAQagXA9nlE15yHAtrW19gdePJh/HaTzUOe/"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"
            integrity="sha384-iF+jqbuti4XlB64clWgFWYEscb+UnSRv3VgVikGYZu+otNFnSHr7y7NcKfBnGizn"
            crossorigin="anonymous"></script>
    <script type="module" src="js/demo.js"></script>
</body>
</html>
