[package]
name = "netget-web"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "NetGet in the browser: the dashboard on xterm.js, protocol servers on a virtual network, the model on a JS bridge (WebLLM or the visitor). Builds only for wasm32-unknown-unknown; see web/README.md."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# NetGet itself. Protocols are not features: the ones that compile for wasm32 are compiled in
# (each one that cannot is gated with `not(target_arch = "wasm32")`; web/README.md has the
# probe), and none of the system-library features apply here.
netget = { package = "netget-tool", path = "../..", default-features = false }
netget-tokio-wasm = { path = "../netget-tokio-wasm" }
netget-crossterm-wasm = { path = "../netget-crossterm-wasm" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
tracing-web = "0.1"

ratatui = { version = "0.29", default-features = false }
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
